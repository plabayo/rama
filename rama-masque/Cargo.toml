[package]
name = "rama-masque"
description = "MASQUE support for rama"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
keywords = ["io", "async", "masque", "proxy", "rama"]
categories = ["asynchronous", "network-programming", "web-programming"]
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.cargo-public-api-crates]
allowed = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
# native C deps can't cross-compile in the docs.rs builder; linux-only docs
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = []
opentelemetry = [
    "rama-core/opentelemetry",
    "rama-http/opentelemetry",
    "rama-net/opentelemetry",
]

[dependencies]
ahash = { workspace = true }
parking_lot = { workspace = true }
rama-core = { workspace = true, features = ["std"] }
rama-dns = { workspace = true }
rama-http = { workspace = true }
rama-net = { workspace = true, features = ["std"] }
rama-quic-proto = { workspace = true }
rama-udp = { workspace = true }
rama-utils = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "sync", "time"] }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["metrics", "testing"] }
rama-http-backend = { workspace = true }
rama-http-core = { workspace = true }
rama-quic = { workspace = true, features = ["rustls", "ring", "test-utils"] }
rama-tls = { workspace = true }
rama-udp = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[lints]
workspace = true
