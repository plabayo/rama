[profile.ci]
failure-output = "immediate-final"
success-output = "never"

[[profile.ci.overrides]]
# The ignored H2 suite should finish in seconds. Stop and retry an individual
# H2 test instead of letting one blocked connection occupy a runner for hours.
filter = 'test(/^h2::/)'
retries = 2
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.ci.overrides]]
# This test starts an origin, a MITM proxy, an inspector, and multiple clients.
# Give those processes the runner instead of competing with the ignored suite.
filter = 'test(/^cli::cli_tests::serve_proxy::test_mitm_capture_export_and_direct_cli_emulation$/)'
threads-required = "num-test-threads"
