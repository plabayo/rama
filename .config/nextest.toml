# cargo test and nextest select the same tests: harness-only targets have `test = false` in
# their manifests and heavy tests are `#[ignore]`d. This file only tunes how CI schedules them.

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
success-output = "never"
# A hung test fails instead of holding a scarce runner until the job's own timeout.
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
# Timing-sensitive tests that need the runner to themselves: multi-megabyte WebSocket
# transfers, a MITM capture with several child processes, the H2 hammer that saturates every
# core, a linear-time rewrite check, and a JS deadline under load.
filter = """
(package(rama-cli) & binary(send_ws) & test(=the_executable_keeps_receiving_while_a_send_is_blocked))
| (package(rama-cli) & binary(cli) & test(=serve_proxy::test_mitm_capture_export_and_direct_cli_emulation))
| (package(rama) & binary(http-core) & test(=h2::hammer::hammer_client_concurrency))
| (package(rama-http) & test(=protocols::html::rewrite::tests::rewriting_time_is_linear_in_the_input))
| (package(rama-js) & test(/a_slow_but_legitimate_script_completes_under_a_generous_limit$/))
"""
threads-required = "num-test-threads"
