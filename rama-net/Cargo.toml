[package]
name = "rama-net"
description = "rama network types and utilities"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
keywords = ["io", "async", "non-blocking", "network", "rama"]
categories = ["asynchronous", "network-programming", "web-programming"]
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.cargo-public-api-crates]
allowed = []

[package.metadata.cargo-machete]
ignored = ["quickcheck"]

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "tokio_unstable"]
rustdoc-args = ["--cfg", "docsrs"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-linux-android",
]

[features]
inspect = ["std", "dep:rama-inspect", "dep:jiff"]
default = ["std"]
std = [
    "dep:arc-swap",
    "rama-macros/std",
    "rama-utils/std",
    "ipnet/std",
    "dep:csv",
    "dep:parking_lot",
    "dep:serde_html_form",
    "dep:socket2",
    "dep:tokio",
    "dep:tokio-util",
    "dep:libc",
    "dep:windows-sys",
    "dep:jni",
    "dep:ndk-context",
    "dep:core-foundation",
    "rama-core/std",
    "dep:ahash",
    "dep:radix_trie",
    "itertools/use_std",
    "memchr/std",
    "dep:moka",
    "percent-encoding/std",
    "dep:mime",
    "dep:base64",
]
test-utils = ["std"]
# IDNA (internationalized domain names) support.
#
# Pulls a non-trivial Unicode-table dependency; keep off if your traffic is ASCII-only.
idna = ["dep:idna"]
# Memory-map IP geolocation databases from disk (MmdbReader::open_mmap) instead
# of reading them fully into memory.
mmap = ["std", "dep:memmap2"]
opentelemetry = ["std", "rama-core/opentelemetry"]
# Optional [dial9] runtime telemetry support.
#
# `--cfg tokio_unstable` widens dial9's task coverage.
#
# [dial9]: https://github.com/dial9-rs/dial9
dial9 = ["std", "dep:dial9", "dep:dial9-trace-format", "rama-core/dial9"]

[dependencies]
ahash = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }
# no workspace inherit: default features (std) must stay off for no_std builds
base64 = { version = "0.23", default-features = false, features = ["alloc"], optional = true }
bitflags = { workspace = true }
const_format = { workspace = true }
csv = { workspace = true, optional = true }
dial9 = { workspace = true, optional = true }
dial9-trace-format = { workspace = true, optional = true }
idna = { workspace = true, optional = true }
ipnet = { workspace = true, features = ["serde"] }
# no workspace inherit: default features (std) must stay off for no_std builds
itertools = { version = "0.15", default-features = false, features = ["use_alloc"] }
itoa = { workspace = true }
jiff = { workspace = true, optional = true }
# no workspace inherit: default features (std) must stay off for no_std builds
memchr = { version = "2.8", default-features = false }
memmap2 = { workspace = true, optional = true }
mime = { workspace = true, optional = true }
moka = { workspace = true, features = ["sync"], optional = true }
parking_lot = { workspace = true, optional = true }
percent-encoding = { workspace = true, default-features = false, features = ["alloc"] }
pin-project-lite = { workspace = true }
psl = { workspace = true }
radix_trie = { workspace = true, optional = true }
rama-core = { workspace = true }
rama-inspect = { workspace = true, optional = true }
rama-macros = { workspace = true }
rama-utils = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_html_form = { workspace = true, optional = true }
socket2 = { workspace = true, features = ["all"], optional = true }
tokio = { workspace = true, features = ["macros", "fs", "io-std", "io-util", "net", "process", "sync", "time"], optional = true }
tokio-util = { workspace = true, optional = true }
venndb = { workspace = true, optional = true }

[target.'cfg(target_family = "unix")'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true, optional = true }
ndk-context = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinHttp", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Threading"], optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
core-foundation = { workspace = true, optional = true }

[dev-dependencies]
ahash = { workspace = true }
itertools = { workspace = true }
quickcheck = { workspace = true }
quickcheck_macros = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-test = { workspace = true }

[lints]
workspace = true
