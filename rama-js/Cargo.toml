[package]
name = "rama-js"
description = "embedded javascript execution for rama"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
keywords = ["javascript", "js", "scripting", "rama"]
categories = ["web-programming", "network-programming"]
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.cargo-public-api-crates]
allowed = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-linux-android",
]

[features]
default = []
http = ["dep:rama-http-types"]

[dependencies]
ahash = { workspace = true }
boa_engine = { workspace = true }
boa_gc = { workspace = true }
parking_lot = { workspace = true }
rama-core = { workspace = true, features = ["std"] }
rama-http-types = { workspace = true, optional = true }
rama-net = { workspace = true, features = ["std"] }
rama-utils = { workspace = true, features = ["std"] }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
