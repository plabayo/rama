[package]
name = "rama-core"
description = "rama service core code, used by rama and service authors"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.cargo-public-api-crates]
allowed = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-linux-android",
]

[features]
default = ["std"]
std = [
    "bytes/std",
    "futures/executor",
    "futures/std",
    "rama-error/std",
    "rama-macros/std",
    "rama-utils/std",
    "tracing/std",
    "dep:ahash",
    "dep:memchr",
    "memchr/std",
    "dep:parking_lot",
    "dep:rand",
    "dep:serde_json",
    "dep:slab",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tokio-util",
    "dep:tracing-appender",
]
opentelemetry = [
    "std",
    "dep:opentelemetry",
    "dep:opentelemetry-semantic-conventions",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]
# Route task spawns through `dial9::spawn` so they pick
# up wake-event tracking when a recorder is attached. Inert when
# no traced runtime is present. `--cfg tokio_unstable` widens dial9's task coverage.
dial9 = ["std", "dep:dial9", "dep:dial9-trace-format", "dep:metrique-writer-core"]
# Tracing setup for test binaries.
test-utils = ["std"]

[dependencies]
ahash = { workspace = true, optional = true }
asynk-strim = { workspace = true }
bytes = { workspace = true }
dial9 = { workspace = true, optional = true }
dial9-trace-format = { workspace = true, optional = true }
futures = { workspace = true, default-features = false, features = ["alloc", "async-await"] }
memchr = { workspace = true, optional = true }
metrique-writer-core = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-semantic-conventions = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true, features = ["metrics", "logs"] }
parking_lot = { workspace = true, optional = true }
pin-project-lite = { workspace = true }
rama-error = { workspace = true }
rama-macros = { workspace = true }
rama-utils = { workspace = true }
rand = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
slab = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "fs", "io-std", "rt", "rt-multi-thread", "sync", "time"], optional = true }
tokio-stream = { workspace = true, features = ["full"], optional = true }
tokio-util = { workspace = true, features = ["codec", "io", "io-util"], optional = true }
tracing = { workspace = true, default-features = false, features = ["attributes"] }
tracing-appender = { workspace = true, features = ["parking_lot"], optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
parking_lot = { workspace = true }
quickcheck = { workspace = true }
rand = { workspace = true }
rustversion = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-test = { workspace = true }
tracing-core = { workspace = true }
trybuild = { workspace = true, features = ["diff"] }

# tokio rewrites itself under `cfg(loom)`; rama-core needs its signal and io modules.
[target.'cfg(rama_loom)'.dev-dependencies]
loom = { workspace = true, features = ["futures"] }

[lints]
workspace = true
