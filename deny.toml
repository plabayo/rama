[advisories]
version = 2
# pin-utils only reaches the build through loom's `futures` feature, a cfg(loom)
# dev-dependency of rama-utils; remove once loom drops it.
ignore = [
    { id = "RUSTSEC-2026-0441", reason = "Unmaintained only; loom uses pin_mut! in cfg(loom) dev builds and no loom release drops it." },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "OpenSSL",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "NCSA",
]

[bans]
multiple-versions = "warn"
highlight = "all"
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = []
