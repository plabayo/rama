[advisories]
version = 2
ignore = [
    # `paste` is unmaintained (no vulnerability, and the advisory itself says
    # no safe upgrade exists). It reaches us only through `boa_engine`, the
    # javascript engine behind `rama-js`, as a proc-macro at build time, not a
    # runtime dependency. Drop this the moment boa moves off it.
    "RUSTSEC-2024-0436",
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "OpenSSL",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "NCSA",
]

[bans]
multiple-versions = "warn"
highlight = "all"
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = []
