# Standalone: not a member of the rama workspace, with its own lockfile, so the upstream QUIC
# peer never reaches the workspace resolution.
[workspace]

[package]
name = "rama-quic-aioquic-interop"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]

[dev-dependencies]
parking_lot = "0.12"
rama = { path = "../../..", features = ["quic", "rustls", "ring"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
