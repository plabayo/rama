
[package]
name = "rama-quic-interop-runner"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
# Standalone: the runner endpoint has its own dependency resolution and image builds.
[workspace]

[[bin]]
name = "rama-quic-interop-client"
path = "src/bin/client.rs"

[[bin]]
name = "rama-quic-interop-server"
path = "src/bin/server.rs"

[features]
boring = ["rama/boring"]
rustls-ring = ["rama/rustls", "rama/ring"]
rustls-aws-lc = ["rama/rustls", "rama/aws-lc"]

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
rama = { path = "../../..", default-features = false, features = ["std", "quic"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
serde_json = "1"
