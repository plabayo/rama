[workspace]

[package]
name = "rama-quic-gnutls-interop"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
parking_lot = "0.12"
rama = { path = "../../..", default-features = false, features = ["quic"] }
zeroize = "1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sha2 = "0.11"
