# Standalone: not a member of the rama workspace, with its own lockfile, so the upstream QUIC
# peer never reaches the workspace resolution.
[workspace]

[package]
name = "rama-quic-quinn-interop"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]

[dev-dependencies]
rama = { path = "../../..", features = ["quic", "rustls", "ring"] }
interop-common = { package = "rama-quic-interop-common", path = "../interop-common" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
parking_lot = "0.12"
sha2 = "0.11"
serde_json = "1"
