[package]
name = "rama-dns"
description = "DNS support for rama"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
keywords = ["io", "async", "dns", "network", "rama"]
categories = ["asynchronous", "network-programming", "web-programming"]
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.cargo-public-api-crates]
allowed = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-linux-android",
]

[package.metadata.cargo-machete]
ignored = ["bindgen", "cc"]

[features]
default = []
hickory = ["dep:hickory-resolver"]
# Back `LinuxDnsResolver` on GNU/Linux with glibc's libresolv stub
# (`res_nquery` walking the `/etc/resolv.conf` search list), which also serves
# CNAME, TXT, SVCB and HTTPS lookups without systemd-resolved.
#
# This compiles a small C shim and runs bindgen at build time, so it needs a
# C compiler and libclang. Without it, GNU/Linux uses `getaddrinfo` for
# address lookups, as on other Linux libc environments. No effect elsewhere.
libresolv = ["dep:bindgen", "dep:cc"]
# Optional [dial9] runtime telemetry support.
#
# [dial9]: https://github.com/dial9-rs/dial9
dial9 = ["dep:dial9", "dep:dial9-trace-format", "rama-net/dial9"]

[dependencies]
ahash = { workspace = true }
arc-swap = { workspace = true }
dial9 = { workspace = true, optional = true }
dial9-trace-format = { workspace = true, optional = true }
hickory-resolver = { workspace = true, optional = true }
moka = { workspace = true, features = ["future", "sync"] }
parking_lot = { workspace = true }
pin-project-lite = { workspace = true }
rama-core = { workspace = true, features = ["std"] }
rama-net = { workspace = true, features = ["std"] }
rama-utils = { workspace = true, features = ["std"] }
rand = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
base64 = { workspace = true, default-features = true }
libc = { workspace = true }
rama-unix = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_NetworkManagement_Dns"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = { workspace = true }

[build-dependencies]
bindgen = { workspace = true, optional = true }
cc = { workspace = true, optional = true }

[dev-dependencies]
ahash = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

# the systemd-resolved varlink client also builds under test on other unixes
[target.'cfg(all(target_family = "unix", not(target_os = "linux")))'.dev-dependencies]
base64 = { workspace = true, default-features = true }
rama-unix = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
