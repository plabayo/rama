[package]
name = "h2-fuzz"
version = "0.0.0"
publish = false
license = "MIT"
edition = "2024"

[dependencies]
rama-core = { workspace = true, features = ["std"] }
rama-http-core = { workspace = true }
rama-http-types = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(not(windows))'.dependencies]
honggfuzz = { workspace = true }

# Keep the fuzz harness's existing lint policy; panics and unwraps expose failures
# to the fuzzer rather than following the production crates' error policy.
[lints]
