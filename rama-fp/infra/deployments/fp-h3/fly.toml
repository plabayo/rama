app = 'rama-fp-h3'
primary_region = 'fra'

[processes]
app_secure = "serve fp --bind 0.0.0.0:443 -c 2048 -t 16 --rate 100 --throttle 1048576 --http-version h3 -s"

[build]
dockerfile = '../Dockerfile.h3'

[env]
RUST_LOG = 'info'
RAMA_IP_GEO_DB = 'geolite2=/geoip/GeoLite2-City.mmdb+/geoip/GeoLite2-ASN.mmdb;ip2location=/geoip/IP2Location-LITE-DB11.mmdb'

[[mounts]]
source = 'geoip'
destination = '/geoip'
processes = ['app_secure']

# The dedicated IPv4 routes UDP directly; this origin has no TCP listener.
[[services]]
protocol = 'udp'
internal_port = 443
processes = ['app_secure']

[[services.ports]]
port = 443

[[vm]]
memory = '256mb'
cpu_kind = 'shared'
cpus = 1
