app = 'rama-fp-h3'
primary_region = 'fra'

[processes]
app_secure = "serve fp --bind fly-global-services:443 -c 2048 -t 16 --rate 100 --throttle 1048576 --http-version h3 --h3-mtu-upper-bound 1280 -s"

[build]
dockerfile = '../Dockerfile.h3'

[env]
# Recording remains opt-in through the DIAL9_ENABLED Fly secret.
DIAL9_TRACE_DIR = '/tmp/dial9-traces'
DIAL9_ROTATION_SECS = '60'
DIAL9_MAX_FILE_SIZE_MB = '8'
DIAL9_MAX_DISK_USAGE_MB = '64'
DIAL9_S3_BUCKET = 'rama-endpoint-diagnostics'
DIAL9_S3_PREFIX = 'dial9'
DIAL9_SERVICE_NAME = 'rama-fp-h3'
RUST_LOG = 'info'
RAMA_IP_GEO_DB = 'geolite2=/geoip/GeoLite2-City.mmdb+/geoip/GeoLite2-ASN.mmdb;ip2location=/geoip/IP2Location-LITE-DB11.mmdb'

[[mounts]]
source = 'geoip'
destination = '/geoip'
processes = ['app_secure']

# The dedicated IPv4 routes UDP directly; this origin has no TCP listener.
[[services]]
protocol = 'udp'
internal_port = 443
processes = ['app_secure']

[[services.ports]]
port = 443

[[vm]]
memory = '256mb'
cpu_kind = 'shared'
cpus = 1
