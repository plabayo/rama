# fly.toml app configuration file generated for rama-echo on 2024-03-19T23:16:07+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rama-ipv4'
primary_region = 'fra'

[processes]
# Public-demo guardrails: rate is process-wide; throttle is per connection/direction.
app_secure = "serve ip --bind 0.0.0.0:8443 -c 2048 --rate 100 --throttle 1048576 -f haproxy -s --h3-bind fly-global-services:443 --h3-mtu-upper-bound 1280"
app_insecure = "serve ip --bind 0.0.0.0:8080 -c 2048 --rate 100 --throttle 1048576 -f haproxy"

[build]
dockerfile = '../Dockerfile.h3'

[env]
# Recording remains opt-in through the DIAL9_ENABLED Fly secret.
DIAL9_TRACE_DIR = '/tmp/dial9-traces'
DIAL9_ROTATION_SECS = '60'
DIAL9_MAX_FILE_SIZE_MB = '8'
DIAL9_MAX_DISK_USAGE_MB = '64'
DIAL9_S3_BUCKET = 'rama-endpoint-diagnostics'
DIAL9_S3_PREFIX = 'dial9'
DIAL9_SERVICE_NAME = 'rama-ipv4'
RUST_LOG = 'info'
# opt-in IP geolocation; files are placed on the 'geoip' volume by geoip_sync.sh
RAMA_IP_GEO_DB = 'geolite2=/geoip/GeoLite2-City.mmdb+/geoip/GeoLite2-ASN.mmdb;ip2location=/geoip/IP2Location-LITE-DB11.mmdb'

# one entry per process group: a bare [mounts] only attaches to one group
[[mounts]]
source = 'geoip'
destination = '/geoip'
processes = ['app_secure']

[[mounts]]
source = 'geoip'
destination = '/geoip'
processes = ['app_insecure']

[[services]]
protocol = 'tcp'
internal_port = 8080
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1
processes = ['app_insecure']

[[services.ports]]
handlers = ["proxy_proto"]
port = 80

[[services]]
protocol = 'tcp'
internal_port = 8443
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1
processes = ['app_secure']

[[services.ports]]
handlers = ["proxy_proto"]
port = 443

# HTTP/3. UDP needs the app's dedicated IPv4 and keeps its port: the app binds 443 itself.
# UDP binds `fly-global-services` (resolved by Dockerfile.h3) so Fly routes the replies.
[[services]]
protocol = 'udp'
internal_port = 443
processes = ['app_secure']

[[services.ports]]
port = 443

[[vm]]
memory = '256mb'
cpu_kind = 'shared'
cpus = 1
