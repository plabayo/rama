[package]
name = "rama-android-tests"
version = "0.0.0"
edition = "2024"
publish = false
description = "On-device Android test suites for rama, run with `just test-android`"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.22"
ndk-context = "0.1"
rama-crypto = { path = "../../../rama-crypto", features = ["native-certs", "ring"] }
rama-net = { path = "../../../rama-net" }

rama-core = { path = "../../../rama-core", features = ["std"] }
rama-utils = { path = "../../../rama-utils", features = ["std"] }
rama-tls = { path = "../../../rama-tls" }
rama-tls-boring = { path = "../../../rama-tls-boring" }
rama-tls-rustls = { path = "../../../rama-tls-rustls", features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "time"] }

[lints.rust]
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
