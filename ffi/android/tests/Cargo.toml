[package]
name = "rama-android-tests"
version = "0.0.0"
edition = "2024"
publish = false
description = "On-device Android test suites for rama, run with `just test-android`"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.22"
ndk-context = "0.1"
rama-crypto = { path = "../../../rama-crypto", features = ["native-certs", "ring"] }
rama-net = { path = "../../../rama-net" }

rama-core = { path = "../../../rama-core", features = ["std"] }
rama-utils = { path = "../../../rama-utils", features = ["std"] }
rama-tls = { path = "../../../rama-tls" }
rama-tls-boring = { path = "../../../rama-tls-boring" }
rama-tls-rustls = { path = "../../../rama-tls-rustls", features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "time"] }

[lints.rust]
unused_imports = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Unsafe hygiene, as in the rama workspace lint table.
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
default_union_representation = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
as_ptr_cast_mut = "warn"
borrow_as_ptr = "warn"
ref_as_ptr = "warn"
cast_ptr_alignment = "warn"
transmute_ptr_to_ptr = "warn"
