[package]
name = "rama_tproxy_example"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["staticlib"]

[features]
default = ["jemallocator"]
# Rust FFI e2e harness build: e2e-only UDP diagnostics, and no dial9 recorder.
e2e = []
jemallocator = ["dep:jemallocator", "dep:tikv-jemalloc-sys"]

[dependencies]
ahash = "0.8"
arc-swap = "1"
base64 = "0.23"
dial9 = { version = "0.5.6", default-features = false, features = ["tokio"] }
jemallocator = { package = "tikv-jemallocator", version = "0.7", optional = true }
moka = { version = "0.12", features = ["sync"] }
rama = { path = "../../../../../", features = ["dial9", "net-apple-networkextension", "net-apple-xpc", "tcp", "udp", "dns", "socks5", "ws", "http-full", "boring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tikv-jemalloc-sys = { version = "0.7", optional = true, features = ["stats"] }
tokio = { version = "1.54", features = ["net", "time"] }

[lints.rust]
unused_imports = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)', 'cfg(loom)'] }
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
mem_forget = "warn"
# Unsafe hygiene, as in the rama workspace lint table.
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
default_union_representation = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
as_ptr_cast_mut = "warn"
borrow_as_ptr = "warn"
ref_as_ptr = "warn"
cast_ptr_alignment = "warn"
transmute_ptr_to_ptr = "warn"
unused_self = "warn"
filter_map_next = "warn"
needless_continue = "warn"
needless_borrow = "warn"
match_wildcard_for_single_variants = "warn"
if_let_mutex = "warn"
implicit_clone = "warn"
await_holding_lock = "warn"
imprecise_flops = "warn"
suboptimal_flops = "warn"
lossy_float_literal = "warn"
rest_pat_in_fully_bound_structs = "warn"
fn_params_excessive_bools = "warn"
exit = "warn"
inefficient_to_string = "warn"
linkedlist = "warn"
macro_use_imports = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
option_option = "warn"
redundant_clone = "warn"
ref_option = "warn"
verbose_file_reads = "warn"
unnested_or_patterns = "warn"
str_to_string = "warn"
type_complexity = "allow"
return_self_not_must_use = "warn"
single_match_else = "warn"
trivially_copy_pass_by_ref = "warn"
use_self = "warn"
uninlined_format_args = "warn"
fallible_impl_from = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
