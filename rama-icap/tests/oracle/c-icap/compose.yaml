name: rama-icap-oracle

services:
  c-icap:
    image: rama-icap-c-icap-oracle:25f881d
    build:
      context: .
      args:
        C_ICAP_COMMIT: 25f881d16f4dfbc943ee0a01d4c174d231afbb57
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${RAMA_ICAP_C_ICAP_PORT:-1345}:1344"
    healthcheck:
      test:
        [
          "CMD",
          "/opt/c-icap/bin/c-icap-client",
          "-i",
          "127.0.0.1",
          "-p",
          "1344",
          "-s",
          "echo",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

  c-icap-204:
    image: rama-icap-c-icap-oracle:25f881d
    build:
      context: .
      args:
        C_ICAP_COMMIT: 25f881d16f4dfbc943ee0a01d4c174d231afbb57
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      [
        "/opt/c-icap/bin/c-icap",
        "-N",
        "-S",
        "-D",
        "-d",
        "3",
        "-f",
        "/opt/c-icap/etc/rama-oracle-204.conf",
      ]
    ports:
      - "127.0.0.1:${RAMA_ICAP_C_ICAP_204_PORT:-1346}:1344"
    healthcheck:
      test:
        [
          "CMD",
          "/opt/c-icap/bin/c-icap-client",
          "-i",
          "127.0.0.1",
          "-p",
          "1344",
          "-s",
          "echo",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
