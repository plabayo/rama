PidFile /tmp/c-icap.pid
CommandsSocket /tmp/c-icap.ctl
Timeout 30
KeepAliveTimeout 30
MaxKeepAliveRequests 100

Port 0.0.0.0:1344
TmpDir /tmp
DebugLevel 1

ModulesDir /opt/c-icap/lib/c_icap
ServicesDir /opt/c-icap/lib/c_icap
TemplateDir /opt/c-icap/share/c_icap/templates

ServerLog /dev/stderr
AccessLog /dev/stdout

SupportBuggyClients off
Pipelining on

Service echo srv_echo.so
echo.Mode allow204
echo.PreviewSize 1024

