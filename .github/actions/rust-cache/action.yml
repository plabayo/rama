name: Rust cache
description: Rust dependency caching with GitHub-managed restore and post-job save hooks.

inputs:
  sccache:
    description: Enable host compiler caching (disable when another tool owns the wrapper)
    required: false
    default: "true"
  key:
    description: Cache key suffix
    required: true
  shared-key:
    description: Complete cache family prefix shared across jobs (replaces key and the job ID when set)
    required: false
    default: ""
  env-vars:
    description: Extra env vars to include in the cache key (space-separated names)
    required: false
    default: ""
  save-if:
    description: Conditional save (forwarded to rust-cache)
    required: false
    default: "true"
  cache-bin:
    description: Whether to cache ~/.cargo/bin (forwarded to rust-cache)
    required: false
    default: "true"
  workspaces:
    description: Workspace directories and their target dirs (forwarded to rust-cache), for projects outside the root workspace
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Keep the action visible to GitHub so its post-if condition and save hook
    # use the real job status. The former Windows retry wrapper skipped saves.
    - name: Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.key }}
        shared-key: ${{ inputs.shared-key }}
        env-vars: ${{ inputs.env-vars }}
        save-if: ${{ inputs.save-if }}
        cache-bin: ${{ inputs.cache-bin }}
        workspaces: ${{ inputs.workspaces }}
    # Activate the wrapper after restore to preserve dependency-cache keys.
    - name: Rust compiler cache
      if: inputs.sccache == 'true'
      uses: ./.github/actions/sccache
