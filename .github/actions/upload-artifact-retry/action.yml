name: Upload artifact with retries
description: Retry transient artifact service failures without rerunning tests.
inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: Files to upload
    required: true
  if-no-files-found:
    description: Behavior when no files match
    default: warn
  retention-days:
    description: Artifact retention in days
    default: '7'
runs:
  using: composite
  steps:
    - id: first
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true
    - if: ${{ !cancelled() && steps.first.outcome == 'failure' }}
      shell: bash
      run: sleep 10
    - id: second
      if: ${{ !cancelled() && steps.first.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true
    - if: ${{ !cancelled() && steps.second.outcome == 'failure' }}
      shell: bash
      run: sleep 30
    # Leave the final attempt fatal: missing evidence must remain visible.
    - if: ${{ !cancelled() && steps.second.outcome == 'failure' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true
