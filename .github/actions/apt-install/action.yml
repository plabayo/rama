name: apt install
description: Install apt packages with time-boxed, retried network waits, so a slow or stalled mirror is retried instead of hanging the job. Gives up within 14 minutes; callers set a longer timeout-minutes.

inputs:
  packages:
    description: Packages to install (space-separated)
    required: true

runs:
  using: composite
  steps:
    - name: Install apt packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        read -ra package_list <<< "$PACKAGES"
        if [[ ${#package_list[@]} -eq 0 ]]; then
          echo "apt-install: no packages given" >&2
          exit 1
        fi
        # A stalled mirror connection errors after 30s instead of waiting forever.
        apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        apt_get() {
          local seconds=$1
          shift
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=10 "$seconds" apt-get "${apt_opts[@]}" "$@"
        }
        # A slow mirror never stalls, so each attempt is time-boxed; packages fetched by an
        # earlier attempt stay in the apt cache and are not downloaded again.
        for attempt in 1 2 3 4; do
          if apt_get 60 update \
            && apt_get 90 install --yes --no-install-recommends --download-only "${package_list[@]}"; then
            # Every package is cached now, so installing does no network I/O.
            apt_get 120 install --yes --no-install-recommends "${package_list[@]}"
            exit 0
          fi
          echo "::warning::apt-install: attempt $attempt of 4 failed"
          # Retry against the runner's fallback archive in case the Azure mirror is the slow one.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          sleep 5
        done
        # CI-retry reruns a job that fails with this message.
        echo "::error::apt-install: could not fetch packages after 4 attempts"
        exit 1
