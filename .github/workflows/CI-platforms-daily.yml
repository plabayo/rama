name: CI (daily platforms)

# Secondary platforms and non-Linux QUIC MSRV coverage run daily or on demand.
env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: stable
  RUST_TOOLCHAIN_MSRV: 1.96.0
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5
  RAMA_DEV_DENY_C_WARNINGS: 1

on:
  schedule:
    # GitHub starts schedules hours late and runs take hours; this lands results by morning.
    - cron: "0 23 * * *"
      timezone: Europe/Brussels
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Use the same repository-wide runner slots as regular CI and releases.
jobs:
  precheck-rust:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: RUST_TOOLCHAIN
          key: ubuntu-latest-${{ env.RUST_TOOLCHAIN }}
          shared-key: linux-stable-check-v1
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      - name: check
        run: just check
      - name: check fuzz targets
        run: RUSTFLAGS="${RUSTFLAGS} --cfg fuzzing" cargo check -p rama-fuzz --all-targets

  # MSRV lint coverage for the scarce macOS and Windows runners. Regular CI keeps
  # MSRV on Linux and stable on every platform; the per-OS MSRV clippy that is
  # not OS-specific lives here so it stays off the per-push critical path.
  check-rust:
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - 1.96.0 # MSRV
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ startsWith(matrix.os, 'macos') && (matrix.toolchain == 'stable' && 'rama-macos-slot-0' || 'rama-macos-slot-1') || startsWith(matrix.os, 'windows') && (matrix.toolchain == 'stable' && 'rama-windows-slot-4' || 'rama-windows-slot-7') || format('rama-linux-check-{0}-{1}', github.run_id, strategy.job-index) }}
      cancel-in-progress: false
      queue: max
    needs:
      - precheck-rust
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: startsWith(matrix.os, 'windows')
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: RUST_TOOLCHAIN
          key: ${{ matrix.os }}-${{ matrix.toolchain }}
          # Warm target restore for every stable check leg (not just Linux); the
          # scarce macOS/Windows runners recompiled from scratch without a family.
          shared-key: ${{ (matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable' && 'linux-stable-check-v1') || (matrix.toolchain == 'stable' && format('{0}-stable-check-v1', matrix.os)) || '' }}
          # sccache is a net loss on Windows (mozilla/sccache#2789: ~0% hits, every
          # write bounces) and its failed entries evict useful macOS/Linux ones.
          sccache: ${{ startsWith(matrix.os, 'windows') && 'false' || 'true' }}
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      # Checks below keep going after a failed check, but never after a failed setup.
      - name: Setup complete
        id: setup
        run: echo "setup complete"
      - name: rustfmt
        run: |
          cargo fmt --all --check
      - name: clippy
        run: just clippy
      - name: doc
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.toolchain == 'stable' && matrix.os != 'ubuntu-latest' }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --all-features --no-deps --workspace --exclude rama-cli --exclude rama-net-apple-xpc
          cargo doc --all-features --no-deps -p rama-cli
      - name: Run Apple XPC QA checks
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.toolchain == 'stable' && matrix.os == 'macos-latest' }}
        run: just qa-xpc-apple
      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          fi

  test-rust-base:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
        os:
          - macos-15
          - macos-15-intel
          - windows-11-arm
          - windows-latest
          - ubuntu-24.04-arm
          - ubuntu-latest
        include:
          # The slowest host runs only the all-features suite; macos-15 covers the rest.
          - os: macos-15-intel
            slim: true
    name: test-rust-base-${{ matrix.toolchain }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ startsWith(matrix.os, 'macos') && (matrix.os == 'macos-15-intel' && 'rama-macos-slot-3' || 'rama-macos-slot-2') || startsWith(matrix.os, 'windows') && (matrix.os == 'windows-11-arm' && 'rama-windows-slot-1' || 'rama-windows-slot-5') || format('rama-linux-native-{0}-{1}', github.run_id, strategy.job-index) }}
      cancel-in-progress: false
      queue: max
    # Cold builds plus successive feature, crypto and integration suites exceed
    # four hours on Windows and macOS. Keep Linux at four hours and allow the
    # hosted-runner maximum for both Windows architectures and both Macs.
    timeout-minutes: ${{ startsWith(matrix.os, 'windows') && 360 || startsWith(matrix.os, 'macos') && 360 || 240 }}
    needs: precheck-rust
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: startsWith(matrix.os, 'windows')
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: nextest
      - uses: ./.github/actions/rust-cache
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain }}-
          env-vars: RUST_TOOLCHAIN
          # Per-OS shared family so repeated test-base runs restore a warm target
          # instead of a cold per-job cache.
          shared-key: ${{ format('{0}-{1}-testbase-v1', matrix.os, matrix.toolchain) }}
          # sccache is a net loss on Windows (mozilla/sccache#2789: ~0% hits, every
          # write bounces) and its failed entries evict useful macOS/Linux ones.
          sccache: ${{ startsWith(matrix.os, 'windows') && 'false' || 'true' }}
      - name: Build run tests (cargo test)
        id: build_tests_all
        run: cargo nextest run --profile ci --all-features --workspace --no-run
      - name: Run tests (cargo test)
        if: ${{ !cancelled() && steps.build_tests_all.outcome == 'success' }}
        run: cargo nextest run --profile ci --all-features --workspace
      - name: Repeat Windows export replacement
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(matrix.os, 'windows') && steps.build_tests_all.outcome == 'success' }}
        run: cargo nextest run --profile ci --all-features --package rama-cli --stress-count 100 --retries 0 export_publishes_complete_json_and_does_not_clobber_without_replace
      - name: Build run tests (--no-default--features)
        id: build_tests_minimal
        if: ${{ !cancelled() && steps.build_tests_all.outcome == 'success' && !matrix.slim }}
        run: cargo nextest run --profile ci --no-default-features --workspace --no-run
      - name: Run tests (--no-default--features)
        if: ${{ !cancelled() && steps.build_tests_minimal.outcome == 'success' }}
        run: cargo nextest run --profile ci --no-default-features --workspace
      - name: Run crypto backend tests
        if: ${{ !cancelled() && steps.build_tests_all.outcome == 'success' && !matrix.slim }}
        shell: bash
        run: bash scripts/test-crypto.sh all --profile ci
      - name: Run doc tests (cargo test)
        if: ${{ !cancelled() && steps.build_tests_all.outcome == 'success' && !matrix.slim }}
        run: cargo test --doc --all-features --workspace --no-fail-fast
      - name: Run example tests (cargo test)
        if: ${{ !cancelled() && steps.build_tests_all.outcome == 'success' && !matrix.slim }}
        run: cargo nextest run --profile ci --all-features --examples --workspace --no-tests=pass
      - name: Run example binary tests
        if: ${{ !cancelled() && steps.build_tests_all.outcome == 'success' && !matrix.slim }}
        run: cargo nextest run --profile ci --all-features --bins --package rama-examples --no-tests=pass
      - name: Run ignored tests
        if: ${{ !cancelled() && steps.build_tests_all.outcome == 'success' && !matrix.slim }}
        timeout-minutes: ${{ runner.os == 'Linux' && 60 || 90 }}
        shell: bash
        run: |
          df -h "$GITHUB_WORKSPACE"
          case "$RUNNER_OS" in
            Linux)
              free -m
              stdbuf -oL vmstat -w -t 30 &
              ;;
            macOS)
              sysctl hw.ncpu hw.memsize vm.swapusage
              top -l 0 -s 30 -n 10 -o mem -stats pid,command,cpu,mem &
              ;;
          esac
          resource_monitor=${!:-}
          trap 'kill "$resource_monitor" 2>/dev/null || true; wait "$resource_monitor" 2>/dev/null || true' EXIT
          time cargo nextest run --profile ci --all-features --workspace --run-ignored=only
      # MITM revocation gate. Linux: hermetic staple matrix (curl --cert-status,
      # incl. the no-staple negative) + proxy-hosted CRL (openssl -crl_check) and
      # OCSP (openssl ocsp) endpoint acceptance + a real-crates.io curl/cargo leg.
      # Windows: cargo through the CONNECT proxy to real crates.io for each
      # leaf-revocation mode (crl, ocsp, both) with re-pointed CRL/AIA pointers,
      # where schannel enforces revocation (the customer scenario libcurl +
      # schannel can't resolve via a staple).
      - name: MITM revocation gate (curl + openssl + cargo)
        if: ${{ !cancelled() && steps.build_tests_all.outcome == 'success' && (matrix.os == 'ubuntu-latest') }}
        env:
          OCSP_GATE_REQUIRE: "1"
        run: bash scripts/ocsp-relay-gate.sh
      - name: MITM revocation gate (cargo / schannel)
        if: ${{ !cancelled() && steps.build_tests_all.outcome == 'success' && (matrix.os == 'windows-latest') }}
        shell: pwsh
        run: ./scripts/ocsp-relay-gate.ps1
      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          fi

  test-quic-interop-qa:
    permissions:
      contents: read
    name: test-quic-interop-qa-${{ matrix.backends }}-${{ matrix.toolchain }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ startsWith(matrix.os, 'macos') && (matrix.toolchain == 'stable' && 'rama-macos-slot-4' || 'rama-macos-slot-5') || startsWith(matrix.os, 'windows') && (matrix.toolchain == 'stable' && 'rama-windows-slot-5' || 'rama-windows-slot-2') || format('rama-linux-quic-{0}-{1}', github.run_id, strategy.job-index) }}
      cancel-in-progress: false
      queue: max
    # Scarce hosts run three isolated backends sequentially, including examples.
    timeout-minutes: ${{ matrix.backends == 'all' && 240 || 120 }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      RUSTFLAGS: -D warnings
    needs: precheck-rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            toolchain: stable
            backends: all
          - os: macos-15
            toolchain: "1.96.0"
            backends: all
          - os: windows-latest
            toolchain: "1.96.0"
            backends: all
          - os: windows-latest
            toolchain: stable
            backends: all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: runner.os == 'Windows'
      # quiche builds BoringSSL with CMake and the runner's C++ toolchain.
      - name: Install the C toolchain quiche builds BoringSSL with
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: cmake clang libclang-dev
      - name: Show the C toolchain quiche will use
        if: runner.os != 'Windows'
        run: |
          cmake --version
          cc --version
      # aioquic runs as a real peer process from a locked Python environment.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Preserve the cache pruning policy from setup-uv v6.
          prune-cache: true
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      - uses: ./.github/actions/rust-cache
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain }}-quic-interop-peers-${{ matrix.backends }}
          env-vars: RUST_TOOLCHAIN
          # sccache 0.18 misparses MSVC -Tp for mimalloc's C++ wrapper,
          # inserting /WX- where the source filename belongs.
          sccache: ${{ startsWith(matrix.os, 'windows') && 'false' || 'true' }}
          workspaces: |
            .
            rama-quic/e2e/interop-common
            rama-quic/e2e/quinn-interop
            rama-quic/e2e/quiche-interop
            rama-quic/e2e/aioquic-interop
            rama-quic/e2e/interop-runner
      - name: Build the aioquic peer's locked environment
        working-directory: rama-quic/e2e/aioquic-interop
        run: uv sync --frozen
      # Checks below keep going after a failed check, but never after a failed setup.
      - name: Setup complete
        id: setup
        run: echo "setup complete"
      - name: Custom TLS provider without built-in backends
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'boring') }}
        run: just rama-quic/qa-custom-provider
      # A `cargo tree --locked` dependency-graph assertion, so its result cannot differ by
      # host or toolchain: one Linux cell covers it. Keeping it off the scarce macOS/Windows
      # runners also keeps this job free of a Python interpreter requirement there.
      - name: Boring dependency isolation including test fixtures
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.backends == 'boring' && matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable' }}
        run: just rama-quic/qa-boring-isolation
      - name: QUIC backend combinations
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.backends == 'boring' && matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable' }}
        shell: bash
        run: |
          for features in ring aws-lc ring,aws-lc rustls boring,rustls boring,ring boring,aws-lc boring,ring,aws-lc boring,rustls,ring boring,rustls,aws-lc rustls,ring,aws-lc boring,rustls,ring,aws-lc; do
            just rama-quic/qa-backend "$features"
          done
      # Independent steps keep collecting failures without combining backend features.
      - name: Isolated QUIC library tests and lints (boring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'boring') }}
        run: just rama-quic/qa-backend boring
      - name: Isolated crypto tests (boring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'boring') }}
        run: cargo test -p rama-crypto --no-default-features --features boring --locked
      - name: QUIC examples (boring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'boring') }}
        run: cargo test -p rama-examples --no-default-features --features quic,boring --test integration quic_ --locked -- --include-ignored
      - name: HTTP/3 streaming and pool integration (boring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'boring') }}
        run: >-
          cargo test -p rama-examples --no-default-features --features http-full,boring --test integration http3_client_server:: --locked -- --include-ignored
      - name: HTTP client protocol and TLS reuse behavior (boring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'boring') }}
        run: >-
          cargo test -p rama --no-default-features --features http-full,boring --test http-core http_service:: --locked
      - name: Concurrent QUIC transfers (boring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'boring') }}
        run: cargo test -p rama-quic --no-default-features --features boring --test many_connections --locked -- --include-ignored
      - name: QUIC receive-window stress (boring)
        timeout-minutes: 15
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.backends == 'boring' && matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable' }}
        run: just rama-quic/qa-stress-backend boring
      - name: QUIC benchmark (boring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'boring') }}
        run: cargo check --bench quic_transport --no-default-features --features quic,boring --locked
      - name: QUIC dial9 (boring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.backends == 'boring' && matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable' }}
        env:
          RUSTFLAGS: --cfg tokio_unstable -D warnings
        run: |
          cargo test -p rama-quic --no-default-features --features dial9,boring --lib dial9 --locked
          cargo test -p rama-quic --no-default-features --features dial9,boring --test dial9_runtime --locked
      - name: Shared scenario library (boring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'boring') }}
        run: just rama-quic/qa-interop-common boring
      - name: Quinn interoperability (boring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'boring') }}
        run: just rama-quic/qa-interop-quinn boring
      - name: quiche interoperability (boring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'boring') }}
        run: just rama-quic/qa-interop-quiche boring
      - name: aioquic interoperability (boring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'boring') }}
        run: just rama-quic/qa-interop-aioquic boring
      - name: Runner endpoint and result gates (boring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'boring') }}
        env:
          PYTHON: ${{ github.workspace }}/rama-quic/e2e/aioquic-interop/.venv/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }}
        run: just rama-quic/qa-interop-runner boring
      - name: Isolated QUIC library tests and lints (rustls-ring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-ring') }}
        run: just rama-quic/qa-backend rustls,ring
      - name: Isolated crypto tests (rustls-ring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-ring') }}
        run: cargo test -p rama-crypto --no-default-features --features ring --locked
      - name: QUIC examples (rustls-ring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-ring') }}
        run: cargo test -p rama-examples --no-default-features --features quic,rustls,ring --test integration quic_ --locked -- --include-ignored
      - name: HTTP/3 streaming and pool integration (rustls-ring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-ring') }}
        run: >-
          cargo test -p rama-examples --no-default-features --features http-full,rustls,ring --test integration http3_client_server:: --locked -- --include-ignored
      - name: HTTP client protocol and TLS reuse behavior (rustls-ring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-ring') }}
        run: >-
          cargo test -p rama --no-default-features --features http-full,rustls,ring --test http-core http_service:: --locked
      - name: Concurrent QUIC transfers (rustls-ring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-ring') }}
        run: cargo test -p rama-quic --no-default-features --features rustls,ring --test many_connections --locked -- --include-ignored
      - name: QUIC receive-window stress (rustls-ring)
        timeout-minutes: 15
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.backends == 'rustls-ring' && matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable' }}
        run: just rama-quic/qa-stress-backend rustls,ring
      - name: QUIC benchmark (rustls-ring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-ring') }}
        run: cargo check --bench quic_transport --no-default-features --features quic,rustls,ring --locked
      - name: QUIC dial9 (rustls-ring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.backends == 'rustls-ring' && matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable' }}
        env:
          RUSTFLAGS: --cfg tokio_unstable -D warnings
        run: |
          cargo test -p rama-quic --no-default-features --features dial9,rustls,ring --lib dial9 --locked
          cargo test -p rama-quic --no-default-features --features dial9,rustls,ring --test dial9_runtime --locked
      - name: Shared scenario library (rustls-ring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-ring') }}
        run: just rama-quic/qa-interop-common rustls-ring
      - name: Quinn interoperability (rustls-ring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-ring') }}
        run: just rama-quic/qa-interop-quinn rustls-ring
      - name: quiche interoperability (rustls-ring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-ring') }}
        run: just rama-quic/qa-interop-quiche rustls-ring
      - name: aioquic interoperability (rustls-ring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-ring') }}
        run: just rama-quic/qa-interop-aioquic rustls-ring
      - name: Runner endpoint and result gates (rustls-ring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-ring') }}
        env:
          PYTHON: ${{ github.workspace }}/rama-quic/e2e/aioquic-interop/.venv/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }}
        run: just rama-quic/qa-interop-runner rustls-ring
      - name: Isolated QUIC library tests and lints (rustls-aws-lc)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-aws-lc') }}
        run: just rama-quic/qa-backend rustls,aws-lc
      - name: Isolated crypto tests (rustls-aws-lc)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-aws-lc') }}
        run: cargo test -p rama-crypto --no-default-features --features aws-lc --locked
      - name: QUIC examples (rustls-aws-lc)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-aws-lc') }}
        run: cargo test -p rama-examples --no-default-features --features quic,rustls,aws-lc --test integration quic_ --locked -- --include-ignored
      - name: HTTP/3 streaming and pool integration (rustls-aws-lc)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-aws-lc') }}
        run: >-
          cargo test -p rama-examples --no-default-features --features http-full,rustls,aws-lc --test integration http3_client_server:: --locked -- --include-ignored
      - name: HTTP client protocol and TLS reuse behavior (rustls-aws-lc)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-aws-lc') }}
        run: >-
          cargo test -p rama --no-default-features --features http-full,rustls,aws-lc --test http-core http_service:: --locked
      - name: Concurrent QUIC transfers (rustls-aws-lc)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-aws-lc') }}
        run: cargo test -p rama-quic --no-default-features --features rustls,aws-lc --test many_connections --locked -- --include-ignored
      - name: QUIC receive-window stress (rustls-aws-lc)
        timeout-minutes: 15
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.backends == 'rustls-aws-lc' && matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable' }}
        run: just rama-quic/qa-stress-backend rustls,aws-lc
      - name: QUIC benchmark (rustls-aws-lc)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-aws-lc') }}
        run: cargo check --bench quic_transport --no-default-features --features quic,rustls,aws-lc --locked
      - name: QUIC dial9 (rustls-aws-lc)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.backends == 'rustls-aws-lc' && matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable' }}
        env:
          RUSTFLAGS: --cfg tokio_unstable -D warnings
        run: |
          cargo test -p rama-quic --no-default-features --features dial9,rustls,aws-lc --lib dial9 --locked
          cargo test -p rama-quic --no-default-features --features dial9,rustls,aws-lc --test dial9_runtime --locked
      - name: Shared scenario library (rustls-aws-lc)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-aws-lc') }}
        run: just rama-quic/qa-interop-common rustls-aws-lc
      - name: Quinn interoperability (rustls-aws-lc)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-aws-lc') }}
        run: just rama-quic/qa-interop-quinn rustls-aws-lc
      - name: quiche interoperability (rustls-aws-lc)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-aws-lc') }}
        run: just rama-quic/qa-interop-quiche rustls-aws-lc
      - name: aioquic interoperability (rustls-aws-lc)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-aws-lc') }}
        run: just rama-quic/qa-interop-aioquic rustls-aws-lc
      - name: Runner endpoint and result gates (rustls-aws-lc)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (matrix.backends == 'all' || matrix.backends == 'rustls-aws-lc') }}
        env:
          PYTHON: ${{ github.workspace }}/rama-quic/e2e/aioquic-interop/.venv/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }}
        run: just rama-quic/qa-interop-runner rustls-aws-lc

  precheck-rust-tier2:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - thing: x86_64-ios
            target: x86_64-apple-ios
            os: macos-15-intel
            rust: stable
            custom_env:
              IPHONEOS_DEPLOYMENT_TARGET: 17.5
    needs: precheck-rust
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ startsWith(matrix.os, 'macos') && 'rama-macos-slot-6' || startsWith(matrix.os, 'windows') && ('rama-windows-slot-2') || format('rama-linux-tier2-{0}-{1}', github.run_id, strategy.job-index) }}
      cancel-in-progress: false
      queue: max
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: RUST_TOOLCHAIN
          key: ${{ matrix.os }}-${{ matrix.rust }}-${{ matrix.target }}
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      - name: Configure Android toolchain env
        if: endsWith(matrix.thing, '-android')
        shell: bash
        run: |
          ANDROID_API=21

          # Normalize NDK env vars
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-$ANDROID_NDK}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${ANDROID_NDK:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"

          TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "${TOOLCHAIN}" >> "$GITHUB_PATH"

          TRIPLE="${{ matrix.target }}"
          TARGET_UPPER="$(echo "${TRIPLE}" | tr '[:lower:]-' '[:upper:]_')"
          TARGET_LOWER_UNDERSCORES="$(echo "${TRIPLE}" | tr '-' '_' | tr '[:upper:]' '[:lower:]')"
          NDK_TRIPLE="${TRIPLE/#armv7/armv7a}"

          CC_PATH="${TOOLCHAIN}/${NDK_TRIPLE}${ANDROID_API}-clang"
          CXX_PATH="${TOOLCHAIN}/${NDK_TRIPLE}${ANDROID_API}-clang++"
          AR_PATH="${TOOLCHAIN}/llvm-ar"

          {
            echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=${CXX_PATH}"

            # Target specific for cc-rs style
            echo "CC_${TARGET_LOWER_UNDERSCORES}=${CC_PATH}"
            echo "CXX_${TARGET_LOWER_UNDERSCORES}=${CXX_PATH}"
            echo "AR_${TARGET_LOWER_UNDERSCORES}=${AR_PATH}"

            # Also set generic vars in case your Config only reads CC/CXX/AR
            echo "CC=${CC_PATH}"
            echo "CXX=${CXX_PATH}"
            echo "AR=${AR_PATH}"
          } >> "$GITHUB_ENV"
      - name: check
        env: ${{ matrix.custom_env }}
        run: just check-tier2 ${{ matrix.target }}

  test-rust-linux-gnu-cross-macos:
    permissions:
      contents: read
    runs-on: macos-latest
    concurrency:
      group: rama-macos-slot-7
      cancel-in-progress: false
      queue: max
    timeout-minutes: 360
    needs: precheck-rust
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-zigbuild@0.23.3
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      - uses: ./.github/actions/rust-cache
        with:
          key: linux-gnu-cross-macos-stable-both
          env-vars: RUST_TOOLCHAIN
      # Checks below keep going after a failed check, but never after a failed setup.
      - name: Setup complete
        id: setup
        run: echo "setup complete"
      # The just recipes are also the documented local developer entry points.
      - name: Cross-link Linux GNU coverage
        run: just test-zigbuild-linux-gnu x86_64-unknown-linux-gnu.2.17
      - name: Cross-link Linux GNU native DNS on AArch64
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just test-zigbuild-linux-gnu-native-dns aarch64-unknown-linux-gnu.2.17
      - name: Upload the cross-built Rama CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rama-cli-linux-x86_64-gnu-glibc-2.17
          path: target/x86_64-unknown-linux-gnu/debug/rama
          if-no-files-found: error
          retention-days: 1

  test-rust-linux-gnu-cross-windows:
    permissions:
      contents: read
    runs-on: windows-latest
    concurrency:
      group: rama-windows-slot-2
      cancel-in-progress: false
      queue: max
    timeout-minutes: 240
    needs: precheck-rust
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-unknown-linux-gnu
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-zigbuild@0.23.3
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      - uses: ./.github/actions/rust-cache
        with:
          key: linux-gnu-cross-windows-latest-stable-x86_64-pc-windows-gnu-x86_64-unknown-linux-gnu.2.17
          env-vars: RUST_TOOLCHAIN
      # The just recipes are also the documented local developer entry points.
      - name: Cross-link Linux GNU coverage
        run: just test-zigbuild-linux-gnu-cli x86_64-unknown-linux-gnu.2.17

  test-rust-linux-gnu-cross-smoke:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: test-rust-linux-gnu-cross-macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rama-cli-linux-x86_64-gnu-glibc-2.17
          path: target/x86_64-unknown-linux-gnu/debug
      - name: Start the cross-built Rama CLI on Linux
        run: just test-zigbuild-linux-gnu-smoke

  cargo-deny-advisories:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo deny (advisories)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: ${{env.RUST_TOOLCHAIN}}
          command: check advisories

  test-rust-e2e-release:
    permissions:
      contents: read
    strategy:
      matrix:
        toolchain:
          - stable
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    # Cold builds and ignored tests exceeded 110m; allow 150m plus 10m for setup and cleanup.
    timeout-minutes: 160
    needs: precheck-rust
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: startsWith(matrix.os, 'windows')
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: nextest
      - uses: ./.github/actions/rust-cache
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain }}-release
          env-vars: RUST_TOOLCHAIN
      - name: Run tests in release mode (--ignored)
        timeout-minutes: 150
        run: |
          # Preserve resource evidence if the runner shuts down during compilation.
          free -m
          df -h "$GITHUB_WORKSPACE"
          stdbuf -oL vmstat -w -t 30 &
          resource_monitor=$!
          trap 'kill "$resource_monitor" 2>/dev/null || true; wait "$resource_monitor" 2>/dev/null || true' EXIT
          # Concurrent release compilations can exhaust this runner's RAM and swap.
          /usr/bin/time -v cargo nextest run --profile ci --build-jobs 2 --all-features --release --workspace --run-ignored=only

  test-js-interpreter:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: precheck-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just,nextest
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-latest-js-interpreter
      - name: Explicit interpreter JS and PAC suites
        run: just test-js-interpreter --profile ci

  ci-success:
    timeout-minutes: 10
    name: Daily platforms success
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - precheck-rust
      - check-rust
      - test-rust-base
      - test-rust-e2e-release
      - test-js-interpreter
      - test-quic-interop-qa
      - precheck-rust-tier2
      - test-rust-linux-gnu-cross-macos
      - test-rust-linux-gnu-cross-windows
      - test-rust-linux-gnu-cross-smoke
      - test-browser-profiles
      - test-safari-desktop
      - test-native-relay-contract
      - test-android-on-device
      - cargo-deny-advisories
    steps:
      - name: Require every daily check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  test-browser-profiles:
    needs: precheck-rust
    name: browser-${{ matrix.browser }}-${{ matrix.protocol }}-${{ matrix.transport }}-${{ matrix.mode }}
    permissions:
      contents: read
    # H3 PDML needs tshark 4.6 per-frame stream identities.
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
        protocol: [h1, h2, h3]
        mode: [debug, release]
        transport: [tls]
        include:
          - {browser: chrome, protocol: h1, transport: plaintext, mode: debug}
          - {browser: chrome, protocol: h1, transport: plaintext, mode: release}
          - {browser: firefox, protocol: h1, transport: plaintext, mode: debug}
          - {browser: firefox, protocol: h1, transport: plaintext, mode: release}
    env:
      BROWSER: ${{ matrix.browser }}
      PROTOCOL: ${{ matrix.protocol }}
      MODE: ${{ matrix.mode }}
      TRANSPORT: ${{ matrix.transport }}
      SE_SKIP_DRIVER_IN_PATH: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Preserve the cache pruning policy from setup-uv v6.
          prune-cache: true
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: ./.github/actions/rust-cache
        with:
          key: browser-profiles-${{ matrix.mode }}
          shared-key: linux-stable-browser-profiles-${{ matrix.mode }}
      - name: Install packet tools and shared browser dependencies
        run: |
          echo 'wireshark-common wireshark-common/install-setuid boolean false' | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark ethtool libcap2-bin libclang-dev cmake ninja-build libnss3-tools
          sudo setcap cap_net_raw,cap_net_admin=eip "$(command -v dumpcap)"
          # Allow only this fixture's evidence and its WebSocket dissector.
          if [ -f /etc/apparmor.d/tshark ]; then
            printf 'owner "%s/{capture-smoke.*,browser-evidence}/**.{pcapng,keys}" r,\nowner "%s/examples/tests/browser_profile/tunnel_payload.lua" r,\n' "$RUNNER_TEMP" "$GITHUB_WORKSPACE" \
              | sudo tee -a /etc/apparmor.d/local/tshark >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/tshark
          fi
          capture_dir=$(mktemp -d "$RUNNER_TEMP/capture-smoke.XXXXXX")
          trap 'rm -rf "$capture_dir"' EXIT
          dumpcap -i lo -a duration:1 -w "$capture_dir/wire.pcapng"
          if ! tshark -r "$capture_dir/wire.pcapng" \
            -X "lua_script:$GITHUB_WORKSPACE/examples/tests/browser_profile/tunnel_payload.lua" \
            -Y rama_ws_tunnel; then
            id
            command -v dumpcap tshark
            getcap "$(command -v dumpcap)" "$(command -v tshark)"
            namei -l "$capture_dir/wire.pcapng"
            sudo journalctl -k --since '-2 minutes' --no-pager | tail -80
            exit 1
          fi
          docker pull postgres:17-alpine
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      - name: Prepare packet-faithful loopback capture
        if: matrix.protocol == 'h3'
        run: |
          python3 examples/tests/browser_profile/capture_environment.py prepare-ci "$RUNNER_TEMP/capture-offload.state"
          python3 examples/tests/browser_profile/capture_environment.py check "$RUNNER_TEMP/capture-smoke.preflight"
      - name: Shared journey and verifier regressions
        run: just test-tools
      - name: Build the same CLI used by local tests
        run: |
          if [ "$MODE" = release ]; then
            cargo build --locked --release -p rama-cli --all-features --bin rama
          else
            cargo build --locked -p rama-cli --all-features --bin rama
          fi
      - name: Capture and verify all six operations
        run: |
          # TLS cells replay every retained connection variant for all six flows.
          tls_args=()
          if [ "$PROTOCOL" = h1 ] && [ "$TRANSPORT" = tls ]; then
            tls_args+=(--tls)
          fi
          just examples/tests/browser-profile-capture \
            --rama "target/${MODE}/rama" --browser "$BROWSER" \
            --protocol "$PROTOCOL" "${tls_args[@]}" --flows all --interface lo \
            --output "$RUNNER_TEMP/browser-evidence"
      - name: Restore loopback UDP segmentation
        if: always() && matrix.protocol == 'h3'
        run: python3 examples/tests/browser_profile/capture_environment.py restore-ci "$RUNNER_TEMP/capture-offload.state"
      - name: Preserve capture admission report
        if: always() && matrix.protocol == 'h3'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-preflight-${{ matrix.browser }}-${{ matrix.protocol }}-${{ matrix.transport }}-${{ matrix.mode }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/capture-smoke.preflight/capture-environment.json
            ${{ runner.temp }}/capture-offload.audit.json
      - name: Preserve comparison reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.protocol }}-${{ matrix.transport }}-${{ matrix.mode }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/browser-evidence/capture-environment.json
            ${{ runner.temp }}/browser-evidence/headers.diagnostics.json
            ${{ runner.temp }}/browser-evidence/replay.diagnostics.json
            ${{ runner.temp }}/browser-evidence/comparison.json
            ${{ runner.temp }}/browser-evidence/summary.json
            ${{ runner.temp }}/browser-evidence/tls-comparison.json
            ${{ runner.temp }}/browser-evidence/capture-fields.json
            ${{ runner.temp }}/browser-evidence/replay-fields.json
            ${{ runner.temp }}/browser-evidence/wire-comparison.json
            ${{ runner.temp }}/browser-evidence/websocket-comparison.json

  test-safari-desktop:
    needs: precheck-rust
    name: browser-safari-macos-${{ matrix.mode }}
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [debug, release]
    # Reuse a scarce macOS slot; Safari owns one desktop automation session.
    concurrency:
      group: rama-macos-slot-8
      queue: max
      cancel-in-progress: false
    env:
      MODE: ${{ matrix.mode }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          prune-cache: true
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: ./.github/actions/rust-cache
        with:
          key: safari-desktop-${{ matrix.mode }}
          shared-key: macos-safari-desktop-${{ matrix.mode }}
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      - name: Prepare desktop Safari
        run: |
          brew install openssl@3 postgresql@17 wireshark
          echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
          sudo chown "$(id -un)" /dev/bpf*
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          sudo safaridriver --enable
          sw_vers
          safaridriver --version
      - name: Shared browser and verifier regressions
        run: |
          just rama-fp/test-tools
          just examples/tests/test-tools
      - name: Build the CLI under test
        run: |
          build_args=()
          if [ "$MODE" = release ]; then build_args+=(--release); fi
          cargo build --locked "${build_args[@]}" -p rama-cli --all-features --bin rama
      - name: Safari full HTTPS, H2 and H3 capture and replay
        run: |
          result=0
          for protocol in h1 h2 h3; do
            just examples/tests/browser-profile-capture \
              --rama "target/$MODE/rama" --browser safari --protocol "$protocol" --tls \
              --flows all --interface lo0 --postgres-backend native \
              --safari-accept-insecure-certs \
              --output "$RUNNER_TEMP/safari-full-$protocol" || result=1
          done
          exit "$result"
      - name: Safari H1/H2 journeys and H1/H2/H3 response regressions
        run: |
          result=0
          for protocol in h1 h2 h3; do
            uv run --frozen --project examples/tests python examples/tests/browser_profile/safari.py \
              --rama "target/$MODE/rama" --protocol "$protocol" \
              --accept-fixture-certificate \
              --output "$RUNNER_TEMP/safari-$protocol" || result=1
          done
          exit "$result"
      - name: Preserve Safari results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-safari-macos-${{ matrix.mode }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/safari-*/report.json
            ${{ runner.temp }}/safari-*/server.log
            ${{ runner.temp }}/safari-full-*/*.json
            ${{ runner.temp }}/safari-full-*/*.pdml
            ${{ runner.temp }}/safari-full-*/*.pcapng
            ${{ runner.temp }}/safari-full-*/*replay.log

  test-native-relay-contract:
    needs: precheck-rust
    name: native-relay-${{ matrix.scenario.label }}-${{ matrix.mode }}
    permissions:
      contents: read
    # H3 PDML needs tshark 4.6 per-frame stream identities.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - { label: h1, protocol: h1, quic_version: 1 }
          - { label: h2, protocol: h2, quic_version: 1 }
          - { label: h3-v1, protocol: h3, quic_version: 1 }
          - { label: h3-v2, protocol: h3, quic_version: 2 }
        mode: [debug, release]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Preserve the cache pruning policy from setup-uv v6.
          prune-cache: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/tests/native_relay/peer/go.mod
          cache-dependency-path: examples/tests/native_relay/peer/go.sum
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: ./.github/actions/rust-cache
        with:
          key: native-relay-${{ matrix.mode }}
          shared-key: linux-stable-native-relay-${{ matrix.mode }}
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      - name: Install local packet and native build tools
        run: |
          echo 'wireshark-common wireshark-common/install-setuid boolean false' | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark ethtool libcap2-bin libclang-dev cmake ninja-build
          sudo setcap cap_net_raw,cap_net_admin=eip "$(command -v dumpcap)"
          # Ubuntu's tshark profile does not include the runner's evidence directory.
          if [ -f /etc/apparmor.d/tshark ]; then
            printf 'owner "%s/{capture-smoke.*,native-relay}/**.{pcapng,keys}" r,\n' "$RUNNER_TEMP" \
              | sudo tee -a /etc/apparmor.d/local/tshark >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/tshark
          fi
          capture_dir=$(mktemp -d "$RUNNER_TEMP/capture-smoke.XXXXXX")
          trap 'rm -rf "$capture_dir"' EXIT
          dumpcap -i lo -a duration:1 -w "$capture_dir/wire.pcapng"
          if ! tshark -r "$capture_dir/wire.pcapng"; then
            id
            command -v dumpcap tshark
            getcap "$(command -v dumpcap)" "$(command -v tshark)"
            namei -l "$capture_dir/wire.pcapng"
            sudo journalctl -k --since '-2 minutes' --no-pager | tail -80
            exit 1
          fi
      - name: Prepare packet-faithful loopback capture
        if: matrix.scenario.protocol == 'h3'
        run: |
          python3 examples/tests/browser_profile/capture_environment.py prepare-ci "$RUNNER_TEMP/capture-offload.state"
          python3 examples/tests/browser_profile/capture_environment.py check "$RUNNER_TEMP/capture-smoke.preflight"
      - name: Verify native relay contract
        run: >-
          just examples/tests/native-relay-contract "$RUNNER_TEMP/native-relay"
          "${{ matrix.scenario.protocol }}" "${{ matrix.mode }}"
          "${{ matrix.scenario.quic_version }}"
      - name: Restore loopback UDP segmentation
        if: always() && matrix.scenario.protocol == 'h3'
        run: python3 examples/tests/browser_profile/capture_environment.py restore-ci "$RUNNER_TEMP/capture-offload.state"
      - name: Preserve capture admission report
        if: always() && matrix.scenario.protocol == 'h3'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-relay-preflight-${{ matrix.scenario.label }}-${{ matrix.mode }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/capture-smoke.preflight/capture-environment.json
            ${{ runner.temp }}/capture-offload.audit.json
      - name: Preserve independently recountable contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-relay-${{ matrix.scenario.label }}-${{ matrix.mode }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/native-relay/artifacts/

  test-android-on-device:
    needs: precheck-rust
    name: android-on-device-api-${{ matrix.api }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 23: the last release without PKIXRevocationChecker; 34: a current one.
        api: [23, 34]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: x86_64-linux-android
      - uses: ./.github/actions/rust-cache
        with:
          key: android-on-device
          workspaces: ffi/android/tests
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect
          # The action installs sdkmanager and adds it to PATH before this hook.
          # Compile NSC instrumentation against API 34 even on the API 23 device.
          pre-emulator-launch-script: sdkmanager "platforms;android-34"
          script: just test-android
