name: Links
'on':
  repository_dispatch: null
  workflow_dispatch: null
  schedule:
  - cron: 00 18 * * *
permissions: {}
jobs:
  linkChecker:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Link Checker
      id: lychee
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        args: --verbose --no-progress './**/*.md' './**/*.html' './**/*.rst' --max-concurrency 20 --max-retries 3
        token: ${{ secrets.GITHUB_TOKEN }}
    - id: result
      if: always()
      env:
        LYCHEE_EXIT: ${{ env.lychee_exit_code }}
      run: |
        if [[ -n "$LYCHEE_EXIT" && "$LYCHEE_EXIT" != 0 ]]; then
          echo 'failed=true' >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always() && steps.result.outputs.failed == 'true'
      with:
        name: link-report
        path: lychee/out.md
        retention-days: 1
        if-no-files-found: error
    outputs:
      failed: ${{ steps.result.outputs.failed }}
  report:
    needs: linkChecker
    if: always() && needs.linkChecker.outputs.failed == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: link-report
        path: lychee
    - name: Create Issue From File
      uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
      with:
        title: Link Checker Report
        content-filepath: ./lychee/out.md
        labels: report, automated issue
