name: Links
'on':
  repository_dispatch: null
  workflow_dispatch: null
  schedule:
  - cron: 00 18 * * *
permissions: {}
jobs:
  linkChecker:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Link Checker
      id: lychee
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        args: --cache --verbose --no-progress './**/*.md' './**/*.html' './**/*.rst' --max-concurrency 8 --max-retries 6 --retry-wait-time 5
        fail: false
        token: ${{ secrets.GITHUB_TOKEN }}
    # lychee 0.24.2 never retries a rejected 5xx status, so one transient 503 fails the run.
    # The recheck reuses cached successes; lychee never reads errors back from its cache.
    - name: Wait before rechecking failed links
      if: steps.lychee.outputs.exit_code != 0
      run: sleep 120
    - name: Recheck failed links
      id: recheck
      if: steps.lychee.outputs.exit_code != 0
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        args: --cache --verbose --no-progress './**/*.md' './**/*.html' './**/*.rst' --max-concurrency 8 --max-retries 6 --retry-wait-time 5
        token: ${{ secrets.GITHUB_TOKEN }}
    - id: result
      if: always()
      env:
        LYCHEE_EXIT: ${{ steps.recheck.outputs.exit_code || steps.lychee.outputs.exit_code }}
      run: |
        if [[ -n "$LYCHEE_EXIT" && "$LYCHEE_EXIT" != 0 ]]; then
          echo 'failed=true' >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always() && steps.result.outputs.failed == 'true'
      with:
        name: link-report
        path: lychee/out.md
        retention-days: 1
        if-no-files-found: error
