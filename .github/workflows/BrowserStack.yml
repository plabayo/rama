name: Browserstack Fingerprinting

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "00 18 * * *"

permissions: {}

jobs:
  run:
    permissions:
      contents: read
    # These integration tests necessarily authenticate; never cache this job.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd rama-fp/browserstack
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      - name: Check shared browser automation
        run: just test-browser-automation
      - name: Run browser journeys
        run: just browserstack-rama-fp "$RUNNER_TEMP/browserstack-evidence"
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          RAMA_FP_STORAGE_COOKIE: ${{ secrets.RAMA_FP_STORAGE_COOKIE }}
      - name: Preserve per-cell receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browserstack-evidence
          if-no-files-found: ignore
          path: ${{ runner.temp }}/browserstack-evidence/
