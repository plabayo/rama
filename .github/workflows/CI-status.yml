name: CI status

# The README badge. GitHub's own CI badge shows a run that a newer push cancelled
# (see CI's concurrency) as failing, so this mirrors the newest main push CI run that
# finished instead. Every run carries a conclusion, never a skip.
on:
  # Metadata-only mirror: no checkout, artifacts, caches, or upstream code execution.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ci-status:
    name: CI status
    permissions:
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Mirror the newest finished main CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The unfiltered listing: GitHub's branch/event/status filters can lag behind.
          workflow_id=$(jq -r .workflow_run.workflow_id "${GITHUB_EVENT_PATH}")
          for attempt in 1 2 3; do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=100") && break
            [[ ${attempt} == 3 ]] && exit 1
            sleep $((attempt * 10))
          done
          # The listing can trail this event, so its run counts too; in-progress and
          # cancelled runs or attempts decide nothing.
          conclusion=$(jq -r --arg repo "${GITHUB_REPOSITORY}" --slurpfile event "${GITHUB_EVENT_PATH}" '
            [.workflow_runs[], $event[0].workflow_run]
            | map(select(.event == "push" and .head_branch == "main"
                and .head_repository.full_name == $repo
                and .status == "completed" and .conclusion != "cancelled"))
            | max_by([.run_number, .run_attempt]).conclusion // "unknown"' <<<"${runs}")
          echo "newest finished main CI run: ${conclusion}"
          [[ "${conclusion}" == "success" ]]
