name: CI status

# The README badge. GitHub's own CI badge shows a run that a newer push cancelled
# (see CI's concurrency) as failing, so this mirrors the newest main push CI run that
# finished instead. Every run carries a conclusion, never a skip.
on:
  # Only trusted default-branch code; never execute code from the triggering run.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ci-status:
    timeout-minutes: 10
    name: CI status
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Mirror the newest finished main CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/mirror-status.sh
