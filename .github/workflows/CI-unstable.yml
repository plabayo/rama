name: CI (unstable toolchains)

# Beta and nightly toolchain jobs live here, on a daily schedule, so that
# new lints / compiler changes get caught without ever blocking main or PRs.

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly
  RUST_TOOLCHAIN_NIGHTLY: nightly
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5
  RAMA_DEV_DENY_C_WARNINGS: 1

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  precheck:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: beta
          components: rustfmt
      - name: Check formatting before reserving platform runners
        run: bash scripts/ci/check-format.sh

  check-rust:
    permissions:
      contents: read
    strategy:
      matrix:
        toolchain:
          - beta
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    needs: precheck
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ startsWith(matrix.os, 'macos') && ('rama-macos-slot-2') || startsWith(matrix.os, 'windows') && ('rama-windows-slot-2') || format('rama-linux-beta-check-{0}-{1}', github.run_id, strategy.job-index) }}
      cancel-in-progress: false
      queue: max
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: startsWith(matrix.os, 'windows')
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: RUST_TOOLCHAIN
          key: ${{ matrix.os }}-${{ matrix.toolchain }}
      - name: rustfmt
        run: |
          cargo fmt --all --check
      - name: clippy
        run: |
          cargo clippy --workspace --all-targets --all-features

  test-rust:
    permissions:
      contents: read
    name: test-rust-${{ matrix.toolchain }}-${{ matrix.profile }}-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - beta
        profile:
          - debug
          - release
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        include:
          - profile: debug
            cargo_profile_args: ""
            cargo_build_args: ""
          - profile: release
            cargo_profile_args: --release
            # Match regular Release CI's cap on concurrent rustc processes.
            cargo_build_args: --build-jobs 2
    needs: precheck
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ startsWith(matrix.os, 'macos') && (matrix.profile == 'debug' && 'rama-macos-slot-0' || 'rama-macos-slot-1') || startsWith(matrix.os, 'windows') && (matrix.profile == 'debug' && 'rama-windows-slot-0' || 'rama-windows-slot-1') || format('rama-linux-beta-test-{0}-{1}', github.run_id, strategy.job-index) }}
      cancel-in-progress: false
      queue: max
    # Cover all three step budgets plus at least 20m for setup and cleanup.
    # Windows debug also needs room for its ~80m ignored compiletest suite.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && matrix.profile == 'release' && 270 || matrix.os == 'windows-latest' && 240 || 210 }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: startsWith(matrix.os, 'windows')
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: nextest
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: RUST_TOOLCHAIN
          key: ${{ matrix.os }}-${{ matrix.toolchain }}-test-${{ matrix.profile }}
      - name: Build tests (${{ matrix.profile }})
        id: build_tests
        # A cold macOS release build already took 108m on a successful run.
        timeout-minutes: ${{ matrix.os == 'macos-latest' && matrix.profile == 'release' && 150 || 90 }}
        shell: bash
        run: |
          # Keep resource evidence in the log even if compilation times out.
          df -h "$GITHUB_WORKSPACE"
          case "$RUNNER_OS" in
            Linux)
              free -m
              stdbuf -oL vmstat -w -t 30 &
              ;;
            macOS)
              sysctl hw.ncpu hw.memsize vm.swapusage
              top -l 0 -s 30 -n 10 -o mem -stats pid,command,cpu,mem &
              ;;
            Windows)
              # PowerShell expands its own variables.
              # shellcheck disable=SC2016
              pwsh -NoProfile -Command '
                while ($true) {
                  Get-Date -Format o
                  Get-CimInstance Win32_OperatingSystem |
                    Select-Object TotalVisibleMemorySize, FreePhysicalMemory,
                      TotalVirtualMemorySize, FreeVirtualMemory |
                    Format-List
                  Get-CimInstance Win32_Processor |
                    Select-Object LoadPercentage | Format-Table
                  Get-Process cargo, rustc, lld, link -ErrorAction SilentlyContinue |
                    Sort-Object WorkingSet64 -Descending |
                    Select-Object -First 10 Name, Id, CPU, WorkingSet64 |
                    Format-Table -AutoSize
                  Start-Sleep -Seconds 30
                }
              ' &
              ;;
          esac
          resource_monitor=$!
          trap 'kill "$resource_monitor" 2>/dev/null || true; wait "$resource_monitor" 2>/dev/null || true' EXIT
          time cargo nextest run --profile ci --no-run --all-features --workspace \
            ${{ matrix.cargo_profile_args }} ${{ matrix.cargo_build_args }}
      - name: Run tests (${{ matrix.profile }})
        if: ${{ !cancelled() && steps.build_tests.outcome == 'success' }}
        # Compilation has its own budget; ordinary tests typically take <10m.
        timeout-minutes: 20
        run: >-
          cargo nextest run --profile ci --all-features ${{ matrix.cargo_profile_args }}
          ${{ matrix.cargo_build_args }} --workspace
      - name: Run ignored tests (${{ matrix.profile }})
        if: ${{ !cancelled() && steps.build_tests.outcome == 'success' }}
        timeout-minutes: ${{ matrix.os == 'windows-latest' && 100 || 80 }}
        run: >-
          cargo nextest run --profile ci --all-features
          ${{ matrix.cargo_profile_args }} ${{ matrix.cargo_build_args }}
          --workspace --run-ignored=only

  clippy-autofix:
    permissions:
      contents: read
    needs: check-rust
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: beta
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
      with:
        toolchain: beta
        components: clippy
    - uses: ./.github/actions/rust-cache
      with:
        env-vars: RUST_TOOLCHAIN
        sccache: 'false'
        key: ubuntu-latest-beta
    - name: cargo clippy --fix
      continue-on-error: true
      run: |
        cargo clippy --workspace --all-targets --all-features \
          --fix --allow-dirty --allow-staged
    - name: Export tracked source changes as data
      id: patch
      shell: bash
      run: |
        set -euo pipefail
        git diff --binary HEAD -- '*.rs' > "$RUNNER_TEMP/changes.patch"
        if [[ -s "$RUNNER_TEMP/changes.patch" ]]; then
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: steps.patch.outputs.has_changes == 'true'
      with:
        name: clippy-autofix-patch
        path: ${{ runner.temp }}/changes.patch
        if-no-files-found: error
        retention-days: 1
    outputs:
      has-changes: ${{ steps.patch.outputs.has_changes }}

  clippy-autofix-pr:
    needs: clippy-autofix
    if: always() && github.ref == 'refs/heads/main' && needs.clippy-autofix.result == 'success' && needs.clippy-autofix.outputs.has-changes
      == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: clippy-autofix-patch
        path: ${{ runner.temp }}/generated-patch
    - name: Open a reviewable PR without running generated code
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        branch="ci/clippy-autofix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        git apply --index --include='*.rs' --exclude='.github/**' "$RUNNER_TEMP/generated-patch/changes.patch"
        if git diff --cached --quiet; then exit 0; fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git -c core.hooksPath=/dev/null commit -m "Apply beta clippy fixes"
        gh auth setup-git
        if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
        fi
        git push --force-with-lease origin "HEAD:refs/heads/$branch"
        body="$RUNNER_TEMP/pr-body.md"
        printf 'Generated source changes from %s/%s/actions/runs/%s. Review before merging.\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$body"
        pr=$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')
        if [[ -n "$pr" ]]; then
          gh pr edit "$pr" --title "Apply beta clippy fixes" --body-file "$body"
        else
          gh pr create --base main --head "$branch" --title "Apply beta clippy fixes" --body-file "$body"
        fi

  test-ffi-apple-example-transparent-proxy-e2e-sanitizers:
    permissions:
      contents: read
    needs: precheck
    runs-on: macos-latest
    concurrency:
      group: rama-macos-slot-3
      cancel-in-progress: false
      queue: max
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ASan needs nightly for `-Z sanitizer=address` and a matching
      # `rust-src` so the sanitizer-built std actually compiles.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly
          components: rust-src
      - uses: ./.github/actions/rust-cache
        with:
          key: macos-latest-nightly-apple-transparent-proxy-e2e-sanitizers
          workspaces: |
            ffi/apple/examples/transparent_proxy/tproxy_rs
            ffi/apple/examples/transparent_proxy/tproxy_rs -> target/asan
            ffi/apple/examples/transparent_proxy/tproxy_ffi_e2e -> target/asan
      - name: Install just
        run: brew install just
      - name: Run transparent proxy FFI stress tests under ASan and Swift TSan
        working-directory: ./ffi/apple/examples/transparent_proxy
        run: just test-e2e-sanitizers

  test-ffi-apple-ne-miri:
    permissions:
      contents: read
    needs: precheck
    runs-on: macos-latest
    concurrency:
      group: rama-macos-slot-4
      cancel-in-progress: false
      queue: max
    timeout-minutes: 60
    env:
      MIRI_TOOLCHAIN: nightly-2026-09-22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-09-22
          components: miri, rust-src
      # Never persist Miri output: it can contain build-time environment data.
      - name: Install just
        run: brew install just
      - name: Run targeted Apple NetworkExtension Miri checks
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/miri-target
        run: just miri-apple-ne-ffi

  fuzz-rust:
    permissions:
      contents: read
    needs: precheck
    runs-on: ubuntu-latest
    env:
      # cargo-fuzz builds with `-Zsanitizer=address`, which is
      # incompatible with statically linked libc. The host's
      # toolchain can pick up `+crt-static` from a recent image
      # default, so disable it explicitly here. rustc emits exactly
      # this fix in the error message when the combination fires.
      RUSTFLAGS: "-C target-feature=-crt-static"
      # `cargo-fuzz` uses the host triple by default. A recent
      # ubuntu-latest image flipped that to
      # `x86_64-unknown-linux-musl`, which isn't installed by
      # `dtolnay/rust-toolchain` and fails the build with
      # "can't find crate for std" / "the
      # x86_64-unknown-linux-musl target may not be installed".
      # Pin to gnu explicitly so the job doesn't depend on
      # whatever the runner's default is on any given day.
      RAMA_FUZZ_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN_NIGHTLY}}
          targets: x86_64-unknown-linux-gnu
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-latest-nightly-fuzz
          env-vars: RUST_TOOLCHAIN
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-fuzz
      - name: Install just
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      # Every smoke goes through `fuzz/justfile`, the same recipes developers run locally;
      # `RAMA_FUZZ_TARGET` above supplies the pinned triple.
      - name: fuzz — ua_parse
        run: just fuzz/ua 30
      - name: fuzz — http_header_x_robots_tag
        run: just fuzz/http-headers-x-robots-tag 30
      - name: fuzz — uri
        run: |
          just fuzz/uri-parse 30
          just fuzz/uri-resolve 30
      - name: fuzz — icap codec and roundtrip
        run: just fuzz/icap 300
      - name: Upload ICAP fuzz corpus and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icap-fuzz-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            fuzz/corpus/icap_codec
            fuzz/corpus/icap_codec_roundtrip
            fuzz/artifacts/icap_codec
            fuzz/artifacts/icap_codec_roundtrip
      - name: fuzz — javascript boundaries
        run: just fuzz/js-value-boundary 30
      - name: fuzz — h2
        run: just fuzz/h2 30
      - name: fuzz — quic
        run: just fuzz/quic 30
      - name: fuzz — h3 and stateful qpack
        run: just fuzz/h3 60
      - name: fuzz — HTTP structured fields
        run: just fuzz/http-structured-fields 60
      - name: Upload H3 and QPACK fuzz corpus and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h3-qpack-fuzz-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            fuzz/corpus/h3_*
            fuzz/corpus/qpack_*
            fuzz/corpus/http_structured_fields
            fuzz/artifacts/h3_*
            fuzz/artifacts/qpack_*
            fuzz/artifacts/http_structured_fields

  docsrs-emulation:
    permissions:
      contents: read
    # Linux is the docs.rs build host. cargo-docs-rs applies each crate's
    # docs.rs metadata and cross-compiles every declared documentation target.
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN_NIGHTLY}}
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-latest-nightly-docsrs-emulation
          env-vars: RUST_TOOLCHAIN
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-docs-rs@1.0.4
      - name: docs.rs per-crate build emulation
        run: |
          python scripts/docsrs_check.py --all-targets

  edge-docs:
    permissions:
      contents: read
    name: edge-docs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    needs: precheck
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ startsWith(matrix.os, 'macos') && ('rama-macos-slot-2') || startsWith(matrix.os, 'windows') && ('rama-windows-slot-3') || format('rama-linux-edge-docs-{0}-{1}', github.run_id, strategy.job-index) }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: startsWith(matrix.os, 'windows')
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN_NIGHTLY}}
      - uses: ./.github/actions/rust-cache
        with:
          key: ${{ matrix.os }}-nightly-edge-docs
          # Match native/check jobs: Windows sccache can fail to spawn rustc.
          sccache: ${{ startsWith(matrix.os, 'windows') && 'false' || 'true' }}
          env-vars: RUST_TOOLCHAIN
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-docs-rs@1.0.4
      - name: docs.rs settings on the native target
        run: |
          python scripts/docsrs_check.py

  refresh-docsrs-bindings:
    permissions:
      contents: read
    name: refresh docs.rs Apple bindings
    if: github.ref == 'refs/heads/main'
    needs: precheck
    runs-on: macos-latest
    concurrency:
      group: rama-macos-slot-1
      cancel-in-progress: false
      queue: max
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
      with:
        toolchain: ${{env.RUST_TOOLCHAIN_NIGHTLY}}
        components: rustfmt
    - uses: ./.github/actions/rust-cache
      with:
        key: macos-latest-nightly-docsrs-bindings
        env-vars: RUST_TOOLCHAIN
    - name: Generate docs.rs Apple bindings
      env:
        RAMA_UPDATE_DOCSRS_BINDINGS: ${{ github.run_id }}
      run: |
        cargo check --locked \
          -p rama-net-apple-networkextension \
          -p rama-net-apple-xpc
    - name: Export tracked source changes as data
      id: patch
      shell: bash
      run: |
        set -euo pipefail
        git diff --binary HEAD -- rama-net-apple-networkextension/docsrs_bindings.rs rama-net-apple-xpc/docsrs_bindings.rs > "$RUNNER_TEMP/changes.patch"
        if [[ -s "$RUNNER_TEMP/changes.patch" ]]; then
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: steps.patch.outputs.has_changes == 'true'
      with:
        name: refresh-docsrs-bindings-patch
        path: ${{ runner.temp }}/changes.patch
        if-no-files-found: error
        retention-days: 1
    outputs:
      has-changes: ${{ steps.patch.outputs.has_changes }}

  refresh-docsrs-bindings-pr:
    needs: refresh-docsrs-bindings
    if: always() && github.ref == 'refs/heads/main' && needs.refresh-docsrs-bindings.result == 'success' && needs.refresh-docsrs-bindings.outputs.has-changes
      == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: refresh-docsrs-bindings-patch
        path: ${{ runner.temp }}/generated-patch
    - name: Open a reviewable PR without running generated code
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        branch="ci/docsrs-apple-bindings"
        git apply --index --include=rama-net-apple-networkextension/docsrs_bindings.rs --include=rama-net-apple-xpc/docsrs_bindings.rs "$RUNNER_TEMP/generated-patch/changes.patch"
        if git diff --cached --quiet; then exit 0; fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git -c core.hooksPath=/dev/null commit -m "Refresh docs.rs Apple bindings"
        gh auth setup-git
        if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
        fi
        git push --force-with-lease origin "HEAD:refs/heads/$branch"
        body="$RUNNER_TEMP/pr-body.md"
        printf 'Generated source changes from %s/%s/actions/runs/%s. Review before merging.\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$body"
        pr=$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')
        if [[ -n "$pr" ]]; then
          gh pr edit "$pr" --title "Refresh docs.rs Apple bindings" --body-file "$body"
        else
          gh pr create --base main --head "$branch" --title "Refresh docs.rs Apple bindings" --body-file "$body"
        fi
