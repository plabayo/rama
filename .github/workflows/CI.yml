        env:
          PYTHON: ${{ github.workspace }}/rama-quic/e2e/aioquic-interop/.venv/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }}
        run: just rama-quic/qa-interop-runner rustls-aws-lc

  test-quic-external-gnutls:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.96.0"]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [precheck-rust, precheck-docs, precheck-fmt, meta-lints]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - name: Install GnuTLS development library and certificate tool
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: libgnutls28-dev gnutls-bin pkg-config
      - name: Show the GnuTLS certificate tool
        run: certtool --version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Preserve the cache pruning policy from setup-uv v6.
          prune-cache: true
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-24.04-${{ matrix.toolchain }}-quic-external-gnutls
          env-vars: RUST_TOOLCHAIN
          workspaces: rama-quic/e2e/gnutls-interop
      - name: Real external TLS provider without Rama native backends
        run: just rama-quic/qa-interop-gnutls

  test-http3-masque-interop:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [precheck-rust, precheck-docs, precheck-fmt, meta-lints]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
      - name: Native TLS build tools
        uses: ./.github/actions/apt-install
        with:
          packages: cmake clang libclang-dev
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          prune-cache: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/tests/masque_interop/peer/go.mod
          cache-dependency-path: examples/tests/masque_interop/peer/go.sum
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-http3-masque-interop
          workspaces: |
            .
            rama-quic/e2e/http-interop
      - name: Build independent Go peer
        id: peer
        run: go -C examples/tests/masque_interop/peer build -o "$RUNNER_TEMP/masque-interop-peer" .
      - name: CONNECT-UDP and tunneled HTTP/3 against masque-go in both roles
        run: just examples/tests/masque-interop "$RUNNER_TEMP/masque-interop"
      - name: Independent HTTP/3 streaming, trailers, multiplexing and cancellation
        if: ${{ !cancelled() && steps.peer.outcome == 'success' }}
        run: |
          set -o pipefail
          failed=0
          for backend in boring rustls-ring rustls-aws-lc; do
            just examples/tests/http3-interop "$RUNNER_TEMP/masque-interop-peer" "$backend" 2>&1 \
              | tee "$RUNNER_TEMP/http3-interop-$backend.log" || failed=1
          done
          exit "$failed"
      - name: Retain HTTP/3 and CONNECT-UDP diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: http3-masque-interop
          path: |
            ${{ runner.temp }}/masque-interop
            ${{ runner.temp }}/http3-interop-*.log
          if-no-files-found: warn
          retention-days: 7

  test-quic-interop-runner:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        backend: [boring, rustls-ring, rustls-aws-lc]
        group: [core, paths, loss]
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add the Wireshark package source
        run: |
          # Launchpad metadata requests can time out before apt runs. Retry only
          # package setup; test failures below must still fail the job.
          for attempt in 1 2 3; do
            if sudo timeout 180s add-apt-repository --yes --no-update ppa:wireshark-dev/stable; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep 5
          done
      - name: Install packet analysis tools
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: tshark
      - name: Prepare packet capture
        run: |
          sudo modprobe ip6table_filter
          tshark --version
          docker compose version
      - name: Set up Docker Engine
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.3.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Preserve the cache pruning policy from setup-uv v6.
          prune-cache: true
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      - name: Test both roles against quic-go and ngtcp2
        run: just rama-quic/test-interop-runner --backend ${{ matrix.backend }} --group ${{ matrix.group }} --artifacts "$RUNNER_TEMP/quic-interop"
      - name: Retain interop reports and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quic-interop-runner-${{ matrix.backend }}-${{ matrix.group }}
          path: ${{ runner.temp }}/quic-interop
          if-no-files-found: warn
          retention-days: 7

  check-rama-icap-feature-boundaries:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
          targets: x86_64-unknown-none
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-latest-${{ env.RUST_TOOLCHAIN }}-icap-features
          env-vars: RUST_TOOLCHAIN
      - name: Test the package without features
        run: cargo test --locked -p rama-icap --no-default-features
      - name: Check each opt-in feature boundary
        run: |
          cargo check --locked -p rama-icap --no-default-features --features std
          cargo check --locked -p rama-icap --no-default-features --features http
      - name: Check the no_std target
        run: >-
          cargo check --locked -p rama-icap --no-default-features
          --target x86_64-unknown-none

  test-rust-linux-musl:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            toolchain: stable
            target: aarch64-unknown-linux-musl
    name: test-rust-linux-musl-${{ matrix.toolchain }}-${{ matrix.os }}-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}
          components: clippy
      - uses: ./.github/actions/rust-cache
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain }}-${{ matrix.target }}
          env-vars: RUST_TOOLCHAIN
      # the getaddrinfo resolver backend only compiles for musl
      - name: Clippy rama-dns
        run: cargo clippy -p rama-dns --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Test rama-dns
        run: cargo test -p rama-dns --lib --target ${{ matrix.target }}
      - name: Install Zig
        if: contains(matrix.target, 'unknown-linux-musl')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-zigbuild
      - name: Build Workspace
        env:
          # Use the same target-aware native tools as the GNU cross-builds.
          # CMake's failed Zig ABI probe can select 32-bit ARM assembly.
          AR: zig ar
          AWS_LC_SYS_CMAKE_BUILDER: "0"
        run: |
          cargo zigbuild -p rama -p rama-cli --target ${{ matrix.target }} --all-features
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Scratch run test (rama-cli, with diagnostics)
        shell: bash
        run: |
          set -euo pipefail

          bin="target/${{ matrix.target }}/debug/rama"
          echo "Binary path: $bin"
          ls -lah "$bin"

          echo "file:"
          file "$bin" || true

          echo "readelf program headers (interpreter should be absent for static):"
          readelf -l "$bin" || true

          echo "readelf dynamic section (NEEDED should be absent for static):"
          readelf -d "$bin" || true

          dir="$(mktemp -d)"
          cp "$bin" "$dir/rama"
          chmod +x "$dir/rama"

          cat > "$dir/Dockerfile" <<'EOF'
          FROM scratch
          COPY rama /rama
          ENTRYPOINT ["/rama"]
          EOF

          echo "Building scratch image"
          docker buildx build --progress=plain --load -t rama-cli-scratch-test "$dir"

          echo "Smoke test in scratch: --help"
          docker run --rm rama-cli-scratch-test --help || true

          echo "HTTPS test in scratch"
          set +e
          docker run --rm --name rama-cli-scratch-test-run \
            rama-cli-scratch-test -k https://example.com
          rc="$?"
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "rama-cli exited with code $rc"

            echo "docker inspect:"
            docker inspect rama-cli-scratch-test-run || true

            echo "docker logs:"
            docker logs rama-cli-scratch-test-run || true

            echo "docker rm:"
            docker rm -f rama-cli-scratch-test-run >/dev/null 2>&1 || true

            exit "$rc"
          fi

  precheck-rust-tier2:
    permissions:
      contents: read
    strategy:
      matrix:
        thing:
          - arm-android
          - arm64-android
          - i686-android
          - x86_64-android
          - aarch64-ios
        include:
          - custom_env: {}
          - thing: arm-android
            target: armv7-linux-androideabi
            rust: stable
            os: ubuntu-latest
          - thing: arm64-android
            target: aarch64-linux-android
            rust: stable
            os: ubuntu-latest
          - thing: i686-android
            target: i686-linux-android
            rust: stable
            os: ubuntu-latest
          - thing: x86_64-android
            target: x86_64-linux-android
            rust: stable
            os: ubuntu-latest
          - thing: aarch64-ios
            target: aarch64-apple-ios
            rust: stable
            os: macos-latest
            custom_env:
              IPHONEOS_DEPLOYMENT_TARGET: 17.5
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ startsWith(matrix.os, 'macos') && (github.event_name == 'pull_request' && (needs.meta-lints.outputs.macos_pr_lane == '1' && 'rama-macos-slot-14' || 'rama-macos-slot-5') || 'rama-macos-slot-9') || startsWith(matrix.os, 'windows') && ('rama-windows-slot-2') || format('rama-linux-tier2-{0}-{1}', github.run_id, strategy.job-index) }}
      cancel-in-progress: false
      queue: max
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: RUST_TOOLCHAIN
          key: ${{ matrix.os }}-${{ matrix.rust }}-${{ matrix.target }}
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      - name: Configure Android toolchain env
        if: endsWith(matrix.thing, '-android')
        shell: bash
        run: |
          ANDROID_API=21

          # Normalize NDK env vars
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-$ANDROID_NDK}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${ANDROID_NDK:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"

          TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "${TOOLCHAIN}" >> "$GITHUB_PATH"

          TRIPLE="${{ matrix.target }}"
          TARGET_UPPER="$(echo "${TRIPLE}" | tr '[:lower:]-' '[:upper:]_')"
          TARGET_LOWER_UNDERSCORES="$(echo "${TRIPLE}" | tr '-' '_' | tr '[:upper:]' '[:lower:]')"
          NDK_TRIPLE="${TRIPLE/#armv7/armv7a}"

          CC_PATH="${TOOLCHAIN}/${NDK_TRIPLE}${ANDROID_API}-clang"
          CXX_PATH="${TOOLCHAIN}/${NDK_TRIPLE}${ANDROID_API}-clang++"
          AR_PATH="${TOOLCHAIN}/llvm-ar"

          {
            echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=${CXX_PATH}"

            # Target specific for cc-rs style
            echo "CC_${TARGET_LOWER_UNDERSCORES}=${CC_PATH}"
            echo "CXX_${TARGET_LOWER_UNDERSCORES}=${CXX_PATH}"
            echo "AR_${TARGET_LOWER_UNDERSCORES}=${AR_PATH}"

            # Also set generic vars in case your Config only reads CC/CXX/AR
            echo "CC=${CC_PATH}"
            echo "CXX=${CXX_PATH}"
            echo "AR=${AR_PATH}"
          } >> "$GITHUB_ENV"
      - name: check
        env: ${{ matrix.custom_env }}
        run: just check-tier2 ${{ matrix.target }}
      - name: Check Android on-device harness
        if: matrix.target == 'x86_64-linux-android'
        run: cargo clippy --locked --target x86_64-linux-android --manifest-path ffi/android/tests/Cargo.toml -- -D warnings

  # The rest of CI builds rama on stable tokio. This job covers dial9's full-fidelity path
  test-dial9-tokio-unstable:
