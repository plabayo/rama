name: CI

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: stable
  RUST_TOOLCHAIN_MSRV: 1.96.0
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  precheck-rust:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: "RUST_TOOLCHAIN=${{ env.RUST_TOOLCHAIN }}"
          key: ubuntu-latest-${{ env.RUST_TOOLCHAIN }}
      - name: check
        run: |
          cargo check --workspace --all-targets --all-features

  precheck-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: verify embedded JavaScript engine artifact
        run: |
          node rama-js/engine/starling/verify-artifact.mjs
      - name: proxy dashboard browser regressions
        run: |
          node --test rama-cli/src/cmd/serve/proxy/dashboard-browser.test.cjs
      - name: profile generator regressions
        run: python3 -m unittest discover -s rama-fp/progen -p 'test_*.py'
      - name: extra-checks
        run: |
          ./scripts/extra-checks.sh
      - name: docsrs-metadata-check
        run: |
          ./scripts/docsrs-metadata-check.sh

  check-rust:
    strategy:
      matrix:
        toolchain:
          - 1.96.0 # MSRV
          - stable
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    needs:
      - precheck-rust
      - precheck-docs
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: startsWith(matrix.os, 'windows')
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: "RUST_TOOLCHAIN=${{ matrix.toolchain }}"
          key: ${{ matrix.os }}-${{ matrix.toolchain }}
      - name: clippy
        run: |
          cargo clippy --workspace --all-targets --all-features
      - name: rustfmt
        run: |
          cargo fmt --all --check

  doc-rust:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    needs:
      - precheck-rust
      - precheck-docs
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: startsWith(matrix.os, 'windows')
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: "RUST_TOOLCHAIN=${{ env.RUST_TOOLCHAIN }}"
          key: ${{ matrix.os }}-${{ env.RUST_TOOLCHAIN }}-doc
      - name: doc
        run: |
          cargo doc --all-features --no-deps --workspace --exclude rama-cli --exclude rama-net-apple-xpc
          cargo doc --all-features --no-deps -p rama-cli

  test-rust-base:
    strategy:
      matrix:
        toolchain:
          - stable
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
          - windows-latest
          - windows-11-arm
    name: test-rust-base-${{ matrix.toolchain }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    needs:
      - precheck-rust
      - precheck-docs
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: startsWith(matrix.os, 'windows')
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: nextest
      - uses: ./.github/actions/rust-cache
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain }}-${{ matrix.target }}
          env-vars: "RUST_TOOLCHAIN=${{ matrix.toolchain }}"
      - name: Run tests (cargo test)
        run: cargo nextest run --all-features --workspace
      - name: Run tests (--no-default--features)
        run: cargo nextest run --no-default-features --workspace
      - name: Run doc tests (cargo test)
        run: cargo test --doc --all-features --workspace
      - name: Run example tests (cargo test)
        run: |
          cargo nextest run --all-features --examples --workspace --no-tests=pass
          cargo nextest run --all-features --bins --package rama-examples --no-tests=pass
      - name: Run ignored tests
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-15'
        timeout-minutes: 60
        run: cargo nextest run --profile ci --all-features --workspace --run-ignored=only
      # MITM revocation gate. Linux: hermetic staple matrix (curl --cert-status,
      # incl. the no-staple negative) + proxy-hosted CRL (openssl -crl_check) and
      # OCSP (openssl ocsp) endpoint acceptance + a real-crates.io curl/cargo leg.
      # Windows: cargo through the CONNECT proxy to real crates.io for each
      # leaf-revocation mode (crl, ocsp, both) with re-pointed CRL/AIA pointers,
      # where schannel enforces revocation (the customer scenario libcurl +
      # schannel can't resolve via a staple).
      - name: MITM revocation gate (curl + openssl + cargo)
        if: matrix.os == 'ubuntu-latest'
        env:
          OCSP_GATE_REQUIRE: "1"
        run: bash scripts/ocsp-relay-gate.sh
      - name: MITM revocation gate (cargo / schannel)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/ocsp-relay-gate.ps1

  test-datastar-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - precheck-rust
      - precheck-docs
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.0"
          cache: false
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-latest-${{ env.RUST_TOOLCHAIN }}-datastar-sdk
          env-vars: "RUST_TOOLCHAIN=${{ env.RUST_TOOLCHAIN }}"
      - name: Run official Datastar SDK test suite
        run: ./scripts/test-datastar-sdk.sh

  test-ffi-apple-example-transparent-proxy-e2e:
    runs-on: macos-latest
    timeout-minutes: 90
    needs:
      - precheck-rust
      - precheck-docs
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
      - uses: ./.github/actions/rust-cache
        with:
          key: macos-latest-${{ env.RUST_TOOLCHAIN }}-apple-transparent-proxy-e2e
          env-vars: "RUST_TOOLCHAIN=${{ env.RUST_TOOLCHAIN }}"
      - name: Install Apple Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install just
        run: brew install just
      - name: Install Apple example build and lint tools
        run: brew install xcodegen shellcheck
      - name: Run transparent proxy Apple QA
        run: just qa-ffi-apple
      - name: Run transparent proxy Apple FFI e2e tests
        run: just test-e2e-ffi-apple
      - name: Rerun Swift FFI battery under lldb on failure
        if: failure()
        run: |
          sysctl hw.ncpu hw.memsize
          ulimit -n
          xcrun lldb --batch \
            -o "run" \
            -k "thread backtrace all" \
            -k "quit 1" \
            -o "quit" \
            -- "$(xcrun --find xctest)" \
            .build/arm64-apple-macosx/debug/RamaAppleNetworkExtensionPackageTests.xctest

  test-rama-apple-ne-swift-ffi:
    runs-on: macos-latest
    timeout-minutes: 90
    needs:
      - precheck-rust
      - precheck-docs
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
      - uses: ./.github/actions/rust-cache
        with:
          key: macos-latest-${{ env.RUST_TOOLCHAIN }}-apple-ne-swift-ffi
          env-vars: "RUST_TOOLCHAIN=${{ env.RUST_TOOLCHAIN }}"
      - name: Install just
        run: brew install just
      - name: Run RamaAppleNetworkExtension Swift FFI tests
        run: just test-e2e-ffi-swift
      - name: Rerun Swift FFI battery under lldb on failure
        if: failure()
        run: |
          sysctl hw.ncpu hw.memsize
          ulimit -n
          xcrun lldb --batch \
            -o "run" \
            -k "thread backtrace all" \
            -k "quit 1" \
            -o "quit" \
            -- "$(xcrun --find xctest)" \
            .build/arm64-apple-macosx/debug/RamaAppleNetworkExtensionPackageTests.xctest
      - name: Run Swift-side ThreadSanitizer battery
        run: just ./ffi/apple/examples/transparent_proxy/run-tproxy-ffi-e2e-swift-tsan
      - name: Build Release products and run optimized Swift FFI tests
        run: just ./ffi/apple/examples/transparent_proxy/run-tproxy-ffi-e2e-swift-release

  test-rama-apple-xpc:
    runs-on: macos-latest
    needs:
      - precheck-rust
      - precheck-docs
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
      - uses: ./.github/actions/rust-cache
        with:
          key: macos-latest-${{ env.RUST_TOOLCHAIN }}-apple-xpc
          env-vars: "RUST_TOOLCHAIN=${{ env.RUST_TOOLCHAIN }}"
      - name: Install just
        run: brew install just
      - name: Run Apple XPC QA checks
        run: just qa-xpc-apple

  test-rama-dial9:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
          components: clippy
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-latest-${{ env.RUST_TOOLCHAIN }}-dial9
          env-vars: "RUST_TOOLCHAIN=${{ env.RUST_TOOLCHAIN }}"
      - name: Run dial9 QA checks
        run: just qa-dial9

  test-fastcgi-php:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-latest-${{ env.RUST_TOOLCHAIN }}-fastcgi-php
          env-vars: "RUST_TOOLCHAIN=${{ env.RUST_TOOLCHAIN }}"
      - name: Install php-fpm and jq
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            php-fpm php-cli jq curl
      - name: Run rama-fastcgi-php end-to-end examples
        run: just test-fastcgi-php

  test-icap-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - precheck-rust
      - precheck-docs
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-latest-${{ env.RUST_TOOLCHAIN }}-icap-oracle
          env-vars: "RUST_TOOLCHAIN=${{ env.RUST_TOOLCHAIN }}"
      - name: Run pinned c-icap interoperability matrix
        env:
          RAMA_ICAP_ORACLE_PROJECT_FILE: ${{ runner.temp }}/rama-icap-oracle-project
        run: just icap-oracle-test
      - name: Stop c-icap interoperability oracle
        if: always()
        env:
          RAMA_ICAP_ORACLE_PROJECT_FILE: ${{ runner.temp }}/rama-icap-oracle-project
        run: |
          if test -f "$RAMA_ICAP_ORACLE_PROJECT_FILE"; then
            project=$(cat "$RAMA_ICAP_ORACLE_PROJECT_FILE")
            docker compose -p "$project" -f rama-icap/tests/oracle/c-icap/compose.yaml \
              down --volumes --remove-orphans
            rm -f "$RAMA_ICAP_ORACLE_PROJECT_FILE"
          fi
          just icap-oracle-down

  check-rama-icap-feature-boundaries:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
          targets: x86_64-unknown-none
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-latest-${{ env.RUST_TOOLCHAIN }}-icap-features
          env-vars: "RUST_TOOLCHAIN=${{ env.RUST_TOOLCHAIN }}"
      - name: Test the package without features
        run: cargo test --locked -p rama-icap --no-default-features
      - name: Check each opt-in feature boundary
        run: |
          cargo check --locked -p rama-icap --no-default-features --features std
          cargo check --locked -p rama-icap --no-default-features --features http
      - name: Check the no_std target
        run: >-
          cargo check --locked -p rama-icap --no-default-features
          --target x86_64-unknown-none

  test-rust-linux-musl:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            toolchain: stable
            target: aarch64-unknown-linux-musl
    name: test-rust-linux-musl-${{ matrix.toolchain }}-${{ matrix.os }}-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs:
      - precheck-rust
      - precheck-docs
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/rust-cache
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain }}-${{ matrix.target }}
          env-vars: "RUST_TOOLCHAIN=${{ matrix.toolchain }}"
      - name: Install Zig
        if: contains(matrix.target, 'unknown-linux-musl')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-zigbuild
      - name: Build Workspace
        run: |
          cargo zigbuild -p rama -p rama-cli --target ${{ matrix.target }} --all-features
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Scratch run test (rama-cli, with diagnostics)
        shell: bash
        run: |
          set -euo pipefail

          bin="target/${{ matrix.target }}/debug/rama"
          echo "Binary path: $bin"
          ls -lah "$bin"

          echo "file:"
          file "$bin" || true

          echo "readelf program headers (interpreter should be absent for static):"
          readelf -l "$bin" || true

          echo "readelf dynamic section (NEEDED should be absent for static):"
          readelf -d "$bin" || true

          dir="$(mktemp -d)"
          cp "$bin" "$dir/rama"
          chmod +x "$dir/rama"

          cat > "$dir/Dockerfile" <<'EOF'
          FROM scratch
          COPY rama /rama
          ENTRYPOINT ["/rama"]
          EOF

          echo "Building scratch image"
          docker buildx build --progress=plain --load -t rama-cli-scratch-test "$dir"

          echo "Smoke test in scratch: --help"
          docker run --rm rama-cli-scratch-test --help || true

          echo "HTTPS test in scratch"
          set +e
          docker run --rm --name rama-cli-scratch-test-run \
            rama-cli-scratch-test -k https://example.com
          rc="$?"
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "rama-cli exited with code $rc"

            echo "docker inspect:"
            docker inspect rama-cli-scratch-test-run || true

            echo "docker logs:"
            docker logs rama-cli-scratch-test-run || true

            echo "docker rm:"
            docker rm -f rama-cli-scratch-test-run >/dev/null 2>&1 || true

            exit "$rc"
          fi

  test-rust-linux-gnu-cross-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-toolchain: stable
            rust-target: x86_64-unknown-linux-gnu
            zig-target: x86_64-unknown-linux-gnu.2.17
            just-recipe: test-zigbuild-linux-gnu
          - os: macos-latest
            rust-toolchain: stable
            rust-target: aarch64-unknown-linux-gnu
            zig-target: aarch64-unknown-linux-gnu.2.17
            just-recipe: test-zigbuild-linux-gnu-native-dns
          - os: windows-latest
            rust-toolchain: stable-x86_64-pc-windows-gnu
            rust-target: x86_64-unknown-linux-gnu
            zig-target: x86_64-unknown-linux-gnu.2.17
            just-recipe: test-zigbuild-linux-gnu-cli
    name: test-rust-linux-gnu-cross-host-${{ matrix.os }}-${{ matrix.rust-target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    needs:
      - precheck-rust
      - precheck-docs
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust-toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: startsWith(matrix.os, 'windows')
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ matrix.rust-toolchain }}
          targets: ${{ matrix.rust-target }}
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-zigbuild@0.23.3
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just
      - uses: ./.github/actions/rust-cache
        with:
          key: linux-gnu-cross-${{ matrix.os }}-${{ matrix.rust-toolchain }}-${{ matrix.zig-target }}
          env-vars: "RUST_TOOLCHAIN=${{ matrix.rust-toolchain }}"
      # The just recipes are also the documented local developer entry points.
      - name: Cross-link Linux GNU coverage
        run: just ${{ matrix.just-recipe }} ${{ matrix.zig-target }}
      - name: Upload the cross-built Rama CLI
        if: matrix.just-recipe == 'test-zigbuild-linux-gnu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rama-cli-linux-x86_64-gnu-glibc-2.17
          path: target/x86_64-unknown-linux-gnu/debug/rama
          if-no-files-found: error
          retention-days: 1

  test-rust-linux-gnu-cross-smoke:
    runs-on: ubuntu-latest
    needs: test-rust-linux-gnu-cross-host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rama-cli-linux-x86_64-gnu-glibc-2.17
          path: target/x86_64-unknown-linux-gnu/debug
      - name: Start the cross-built Rama CLI on Linux
        run: just test-zigbuild-linux-gnu-smoke

  precheck-rust-tier2:
    strategy:
      matrix:
        thing:
          - arm-android
          - arm64-android
          - i686-android
          - x86_64-android
          - aarch64-ios
          - x86_64-ios
        include:
          - custom_env: {}
          - thing: arm-android
            target: armv7-linux-androideabi
            rust: stable
            os: ubuntu-latest
          - thing: arm64-android
            target: aarch64-linux-android
            rust: stable
            os: ubuntu-latest
          - thing: i686-android
            target: i686-linux-android
            rust: stable
            os: ubuntu-latest
          - thing: x86_64-android
            target: x86_64-linux-android
            rust: stable
            os: ubuntu-latest
          - thing: aarch64-ios
            target: aarch64-apple-ios
            rust: stable
            os: macos-latest
            custom_env:
              IPHONEOS_DEPLOYMENT_TARGET: 17.5
          - thing: x86_64-ios
            target: x86_64-apple-ios
            os: macos-15-intel
            rust: stable
            custom_env:
              IPHONEOS_DEPLOYMENT_TARGET: 17.5
    needs:
      - precheck-rust
      - precheck-docs
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: "RUST_TOOLCHAIN=${{ matrix.rust }}"
          key: ${{ matrix.os }}-${{ matrix.rust }}-${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}
      - name: Configure Android toolchain env
        if: endsWith(matrix.thing, '-android')
        shell: bash
        run: |
          ANDROID_API=21

          # Normalize NDK env vars
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-$ANDROID_NDK}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${ANDROID_NDK:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"

          TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "${TOOLCHAIN}" >> "$GITHUB_PATH"

          TRIPLE="${{ matrix.target }}"
          TARGET_UPPER="$(echo "${TRIPLE}" | tr '[:lower:]-' '[:upper:]_')"
          TARGET_LOWER_UNDERSCORES="$(echo "${TRIPLE}" | tr '-' '_' | tr '[:upper:]' '[:lower:]')"
          NDK_TRIPLE="$(echo "${TRIPLE}" | sed 's/^armv7/armv7a/')"

          CC_PATH="${TOOLCHAIN}/${NDK_TRIPLE}${ANDROID_API}-clang"
          CXX_PATH="${TOOLCHAIN}/${NDK_TRIPLE}${ANDROID_API}-clang++"
          AR_PATH="${TOOLCHAIN}/llvm-ar"

          echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=${CXX_PATH}" >> "$GITHUB_ENV"

          # Target specific for cc-rs style
          echo "CC_${TARGET_LOWER_UNDERSCORES}=${CC_PATH}" >> "$GITHUB_ENV"
          echo "CXX_${TARGET_LOWER_UNDERSCORES}=${CXX_PATH}" >> "$GITHUB_ENV"
          echo "AR_${TARGET_LOWER_UNDERSCORES}=${AR_PATH}" >> "$GITHUB_ENV"

          # Also set generic vars in case your Config only reads CC/CXX/AR
          echo "CC=${CC_PATH}" >> "$GITHUB_ENV"
          echo "CXX=${CXX_PATH}" >> "$GITHUB_ENV"
          echo "AR=${AR_PATH}" >> "$GITHUB_ENV"
      - name: check
        env: ${{ matrix.custom_env }}
        run: |
          cargo check --workspace --target ${{ matrix.target }} --all-features
      - name: Build tests
        env: ${{ matrix.custom_env }}
        # We `build` because we want the linker to verify we are cross-compiling correctly for check-only targets.
        run: |
          cargo build --target ${{ matrix.target }} --tests --all-features

  # The rest of CI builds rama on stable tokio. This job covers dial9's full-fidelity path
  test-dial9-tokio-unstable:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
          components: clippy
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: "RUST_TOOLCHAIN=${{env.RUST_TOOLCHAIN}}"
          key: ubuntu-latest-${{env.RUST_TOOLCHAIN}}-dial9-tokio-unstable
      # The recipe sets `--cfg tokio_unstable`, setting RUSTFLAGS here would
      # not survive the justfile's own `export RUSTFLAGS`.
      - name: Run dial9 QA checks under tokio_unstable
        run: just qa-dial9-tokio-unstable

  test-loom:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: nextest
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: "RUST_TOOLCHAIN=${{env.RUST_TOOLCHAIN}}"
          key: ubuntu-latest-${{env.RUST_TOOLCHAIN}}-loom
      - name: Run Loom tests (rama-utils)
        run: |
          RUSTFLAGS="--cfg loom -Dwarnings" \
            cargo nextest run --all-features -p rama-utils

  cargo-hack-base:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-hack
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: "RUST_TOOLCHAIN=${{env.RUST_TOOLCHAIN}}"
          key: ubuntu-latest-${{env.RUST_TOOLCHAIN}}-cargo-hack-base
      - name: install protoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
          protoc --version
      - name: cargo hack check without dial9
        run: cargo hack check --each-feature --exclude-features dial9 --exclude-all-features --no-dev-deps --workspace

  # Every feature combination, dial9 included
  cargo-hack-dial9:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-hack
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: "RUST_TOOLCHAIN=${{env.RUST_TOOLCHAIN}}"
          key: ubuntu-latest-${{env.RUST_TOOLCHAIN}}-cargo-hack-dial9
      - name: install protoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
          protoc --version
      - name: cargo hack check with dial9
        run: cargo hack check --each-feature --no-dev-deps --workspace

  meta-lints:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: ${{env.RUST_TOOLCHAIN}}
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-sort
      - name: cargo sort (dependencies)
        run: cargo sort --workspace --grouped --check

  test-rust-e2e-release:
    strategy:
      matrix:
        toolchain:
          - stable
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    # Allow for a cold build with reduced parallelism plus ~40m of ignored tests.
    timeout-minutes: 120
    needs:
      - precheck-rust
      - precheck-docs
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: startsWith(matrix.os, 'windows')
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: nextest
      - uses: ./.github/actions/rust-cache
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain }}-release
          env-vars: "RUST_TOOLCHAIN=${{ matrix.toolchain }}"
      - name: Run tests in release mode (--ignored)
        timeout-minutes: 110
        run: |
          # Preserve resource evidence if the runner shuts down during compilation.
          free -m
          df -h "$GITHUB_WORKSPACE"
          stdbuf -oL vmstat -w -t 30 &
          resource_monitor=$!
          trap 'kill "$resource_monitor" 2>/dev/null || true; wait "$resource_monitor" 2>/dev/null || true' EXIT
          # Concurrent release compilations can exhaust this runner's RAM and swap.
          /usr/bin/time -v cargo nextest run --build-jobs 2 --profile ci --all-features --release --workspace --run-ignored=only

  test-ws-autobahn-server:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
    # The server suite usually takes ~12-22m.
    timeout-minutes: 90
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-latest-${{ env.RUST_TOOLCHAIN }}-autobahn-server
          env-vars: "RUST_TOOLCHAIN=${{env.RUST_TOOLCHAIN}}"
      - name: Verify jq
        run: jq --version
      - name: Run autobahn ws server test-suite
        shell: bash
        working-directory: "./rama-ws"
        timeout-minutes: 30
        run: ./autobahn/server.sh

  test-ws-autobahn-client:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
    # The client suite usually takes ~7-13m, but overloaded hosted runners
    # have occasionally made it exceed 25m.
    timeout-minutes: 90
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-latest-${{ env.RUST_TOOLCHAIN }}-autobahn-client
          env-vars: "RUST_TOOLCHAIN=${{env.RUST_TOOLCHAIN}}"
      - name: Verify jq
        run: jq --version
      - name: Run autobahn ws client test-suite
        shell: bash
        working-directory: "./rama-ws"
        timeout-minutes: 45
        run: ./autobahn/client.sh

  test-spec-h2:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
      - name: h2spec
        run: |
          bash rama-http-core/ci/h2spec.sh -F

  semver-checks:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
    env:
      # The released 0.4 baseline still depends on dial9 0.3, which only
      # compiles with Tokio's unstable APIs (the workspace config used to
      # carry this flag). Drop once a dial9-0.5-based rama is the
      # published baseline.
      RUSTFLAGS: --cfg tokio_unstable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          rust-toolchain: ${{env.RUST_TOOLCHAIN}}

  deploy-rama-cli-docker:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust-tier2
      - check-rust
      - doc-rust
      - test-rust-base
      - check-rama-icap-feature-boundaries
      - test-icap-oracle
      - test-ffi-apple-example-transparent-proxy-e2e
      - test-rama-apple-ne-swift-ffi
      - test-fastcgi-php
      - test-rust-linux-musl
      - test-rust-linux-gnu-cross-smoke
      - test-rama-apple-xpc
      - test-dial9-tokio-unstable
      - test-loom
      - cargo-hack-base
      - cargo-hack-dial9
      - meta-lints
      - test-rust-e2e-release
      - test-ws-autobahn-server
      - test-ws-autobahn-client
      - test-spec-h2
      - semver-checks
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          tags: glendc/rama:edge
          file: rama-cli/infra/Dockerfile

  deploy-rama-fp-fly:
    runs-on: ubuntu-latest
    needs: deploy-rama-cli-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: |
          cd rama-fp/infra/deployments/fp
          flyctl deploy --verbose --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-rama-fp-h1-fly:
    runs-on: ubuntu-latest
    needs: deploy-rama-cli-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: |
          cd rama-fp/infra/deployments/fp-h1
          flyctl deploy --verbose --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-rama-ip-ipv4-fly:
    runs-on: ubuntu-latest
    needs: deploy-rama-cli-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: |
          cd rama-fp/infra/deployments/ipv4
          flyctl deploy --verbose --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-rama-ip-ipv6-fly:
    runs-on: ubuntu-latest
    needs: deploy-rama-cli-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: |
          cd rama-fp/infra/deployments/ipv6
          flyctl deploy --verbose --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-rama-echo-fly:
    runs-on: ubuntu-latest
    needs: deploy-rama-cli-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: |
          cd rama-fp/infra/deployments/echo
          flyctl deploy --verbose --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-rama-http-test-fly:
    runs-on: ubuntu-latest
    needs: deploy-rama-cli-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: |
          cd rama-fp/infra/deployments/http-test
          flyctl deploy --verbose --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
