        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-09-22
          components: miri, rust-src
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      # Never persist Miri output: it can contain build-time environment data.
      - name: Run Miri on the lock-free collections
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/miri-target
        run: just miri-collections

  cargo-hack:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-hack@0.6.45
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: RUST_TOOLCHAIN
          key: ubuntu-latest-${{env.RUST_TOOLCHAIN}}-cargo-hack-${{ matrix.partition }}
      - name: install protoc
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: protobuf-compiler
      - name: Show protoc version
        run: protoc --version
      - name: Check every individual feature, including dial9
