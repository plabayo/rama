  test-ws-autobahn-server:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    # The server suite usually takes ~12-22m.
    timeout-minutes: 90
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-latest-${{ env.RUST_TOOLCHAIN }}-autobahn-server
          env-vars: RUST_TOOLCHAIN
      - name: Verify jq
        run: jq --version
      # A cold release build alone can take ~20m; keep it out of the suite's budget.
      - name: Build autobahn ws server
        timeout-minutes: 45
        run: cargo build --release -p rama-cli
      - name: Run autobahn ws server test-suite
        shell: bash
        working-directory: "./rama-ws"
        timeout-minutes: 30
        run: ./autobahn/server.sh

  test-ws-autobahn-client:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    # The client suite usually takes ~7-13m, but overloaded hosted runners
    # have occasionally made it exceed 25m.
    timeout-minutes: 90
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-latest-${{ env.RUST_TOOLCHAIN }}-autobahn-client
          env-vars: RUST_TOOLCHAIN
      - name: Verify jq
        run: jq --version
      # A cold release build alone can take ~20m; keep it out of the suite's budget.
      - name: Build autobahn ws client
        timeout-minutes: 45
        run: cargo build --release -p rama-examples --bin autobahn_client --features=http-full
      - name: Run autobahn ws client test-suite
        shell: bash
        working-directory: "./rama-ws"
        timeout-minutes: 45
        run: ./autobahn/client.sh

  test-spec-h2:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
      - uses: ./.github/actions/sccache
      - name: h2spec
        run: |
          bash rama-http-core/ci/h2spec.sh -F

  semver-checks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    env:
      # The released 0.4 baseline still depends on dial9 0.3, which only
      # compiles with Tokio's unstable APIs (the workspace config used to
      # carry this flag). Drop once a dial9-0.5-based rama is the
      # published baseline.
      RUSTFLAGS: --cfg tokio_unstable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          rust-toolchain: ${{env.RUST_TOOLCHAIN}}

  ci-success:
    timeout-minutes: 10
    name: CI success
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - precheck-rust
      - precheck-docs
      - test-tools
      - test-js-interpreter
      - check-rust
      - doc-rust
      - test-rust-base
      - test-rust-examples
      - test-datastar-sdk
      - test-ffi-apple-example-transparent-proxy-e2e
      - test-rama-dial9
      - test-fastcgi-php
      - test-icap-oracle
      - test-quic-interop-qa
      - test-quic-interop-runner
      - test-http3-masque-interop
      - test-quic-external-gnutls
      - check-rama-icap-feature-boundaries
      - test-rust-linux-musl
      - precheck-rust-tier2
      - test-dial9-tokio-unstable
      - test-loom
      - test-miri-collections
      - meta-lints
      - test-ws-autobahn-server
      - test-ws-autobahn-client
      - test-spec-h2
      - semver-checks
      - cargo-hack
      - precheck-fmt
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.[]; .value.result == "success")'

  deploy-rama-cli-docker:
    permissions:
      contents: read
    needs: ci-success
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.ci-success.result == 'success' }}
    uses: ./.github/workflows/publish-containers.yml
    with:
      source-ref: ${{ github.sha }}
      image-tag: edge
      floating-tag: edge
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy-rama-fp-fly:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: deploy-rama-cli-docker
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.deploy-rama-cli-docker.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master (Node 24)
      - run: |
          cd rama-fp/infra/deployments/fp
          flyctl scale count app_secure=1 app_insecure=1 --yes
          flyctl deploy --verbose --remote-only --ha=false --build-arg "RAMA_IMAGE=glendc/rama@$RAMA_DIGEST"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # The image this run published, not whatever `edge` a builder has cached.
          RAMA_DIGEST: ${{ needs.deploy-rama-cli-docker.outputs.rama-digest }}

