name: CI

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: stable
  RUST_TOOLCHAIN_MSRV: 1.96.0
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5
  RAMA_DEV_DENY_C_WARNINGS: 1

on:
  push:
    branches:
      - main
  pull_request: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes (main included) abandon their scarce macOS/Windows slots
  # immediately instead of serializing multi-hour runs behind each other.
  cancel-in-progress: true

# Scarce runners share repository-wide slots with Pages, unstable CI, and releases.
# macOS (GitHub cap 15): 0-1 slowest CI jobs, 2-5 or 10/11/13/14 PR CI, 6-9 main CI and releases,
# 12 Pages; nightlies use 0-11.
# Keep group names independent of workflow/ref; see scripts/ci/README.md.

jobs:
  precheck-rust:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: RUST_TOOLCHAIN
          key: ubuntu-latest-${{ env.RUST_TOOLCHAIN }}
          shared-key: linux-stable-check-v1
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      - name: check
        run: just check
      - name: check fuzz targets
        run: RUSTFLAGS="${RUSTFLAGS} --cfg fuzzing" cargo check -p rama-fuzz --all-targets

  precheck-docs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: verify embedded JavaScript engine artifact
        run: |
          node rama-js/engine/starling/verify-artifact.mjs
      - name: proxy dashboard browser regressions
        run: |
          node --test rama-cli/src/cmd/serve/proxy/dashboard-browser.test.cjs
      - name: extra-checks
        run: |
          ./scripts/extra-checks.sh

  test-tools:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Preserve the cache pruning policy from setup-uv v6.
          prune-cache: true
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      - name: Profile and relay tool regressions
        run: just test-tools

  test-js-interpreter:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [precheck-rust, precheck-docs, precheck-fmt, meta-lints]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just,nextest
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-latest-js-interpreter
      - name: Explicit interpreter JS and PAC suites
        run: just test-js-interpreter --profile ci

  precheck-fmt:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.96.0"]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Workspace and standalone project formatting
        run: bash scripts/ci/check-format.sh

  meta-lints:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      # Alternates PR runs between two macOS slot lanes; expressions cannot do arithmetic.
      macos_pr_lane: ${{ steps.macos-pr-lane.outputs.lane }}
    steps:
      - name: Pick the macOS PR lane
        id: macos-pr-lane
        run: echo "lane=$((GITHUB_RUN_NUMBER % 2))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          # v2.1.4 assets were replaced upstream; keep checksum verification intact.
          tool: cargo-sort@2.1.3,just
      - name: cargo sort (dependencies)
        run: cargo sort --workspace --grouped --check
      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$HOME/.cargo/bin" actionlint
          actionlint --version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Preserve the cache pruning policy from setup-uv v6.
          prune-cache: true
      - name: Lint workflows and test CI helpers
        run: just scripts/ci/qa
      - name: cargo deny
        # Advisories change without a commit, so they run in CI (daily platforms).
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: ${{env.RUST_TOOLCHAIN}}
          command: check bans licenses sources

  check-rust:
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - 1.96.0 # MSRV
          - stable
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        exclude:
          # MSRV clippy is not OS-specific and Linux covers MSRV compilation, so
          # the macOS and Windows MSRV cells run in CI (daily platforms) instead.
          - toolchain: 1.96.0
            os: macos-latest
          - toolchain: 1.96.0
            os: windows-latest
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ startsWith(matrix.os, 'macos') && (github.event_name == 'pull_request' && (needs.meta-lints.outputs.macos_pr_lane == '1' && 'rama-macos-slot-11' || 'rama-macos-slot-3') || 'rama-macos-slot-7') || startsWith(matrix.os, 'windows') && (matrix.toolchain == 'stable' && 'rama-windows-slot-4' || 'rama-windows-slot-7') || format('rama-linux-check-{0}-{1}', github.run_id, strategy.job-index) }}
      cancel-in-progress: false
      queue: max
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: startsWith(matrix.os, 'windows')
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: RUST_TOOLCHAIN
          key: ${{ matrix.os }}-${{ matrix.toolchain }}
          # Warm target restore for every stable check leg (not just Linux); the
          # scarce macOS/Windows runners recompiled from scratch without a family.
          shared-key: ${{ (matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable' && 'linux-stable-check-v1') || (matrix.toolchain == 'stable' && format('{0}-stable-check-v1', matrix.os)) || '' }}
          # sccache is a net loss on Windows (mozilla/sccache#2789: ~0% hits, every
          # write bounces) and its failed entries evict useful macOS/Linux ones.
          sccache: ${{ startsWith(matrix.os, 'windows') && 'false' || 'true' }}
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      # Checks below keep going after a failed check, but never after a failed setup.
      - name: Setup complete
        id: setup
        run: echo "setup complete"
      - name: rustfmt
        run: |
          cargo fmt --all --check
      - name: clippy
        run: just clippy
      - name: doc
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.toolchain == 'stable' && matrix.os != 'ubuntu-latest' }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --all-features --no-deps --workspace --exclude rama-cli --exclude rama-net-apple-xpc
          cargo doc --all-features --no-deps -p rama-cli
      - name: Run Apple XPC QA checks
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.toolchain == 'stable' && matrix.os == 'macos-latest' }}
        run: just qa-xpc-apple
      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          fi

  doc-rust:
    permissions:
      contents: read
    strategy:
      matrix:
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: startsWith(matrix.os, 'windows')
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: RUST_TOOLCHAIN
          key: ${{ matrix.os }}-${{ env.RUST_TOOLCHAIN }}-doc
      - name: doc
        run: |
          cargo doc --all-features --no-deps --workspace --exclude rama-cli --exclude rama-net-apple-xpc
          cargo doc --all-features --no-deps -p rama-cli
      - name: Test documentation
        run: cargo test --profile ci --doc --all-features --workspace --no-fail-fast

  test-rust-base:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
        # Feature combinations and revocation end-to-end gates run daily.
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        shard: [libraries, applications]
        include:
          - shard: libraries
            packages: --workspace --exclude rama-examples --exclude rama --exclude rama-cli
          - shard: applications
            packages: -p rama -p rama-cli
    name: test-rust-base-${{ matrix.os }}-${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ matrix.os == 'macos-latest' && (matrix.shard == 'libraries' && 'rama-macos-slot-1' || (github.event_name == 'pull_request' && (needs.meta-lints.outputs.macos_pr_lane == '1' && 'rama-macos-slot-10' || 'rama-macos-slot-2') || 'rama-macos-slot-6')) || matrix.os == 'windows-latest' && format('rama-windows-slot-{0}', matrix.shard == 'libraries' && '6' || '7') || format('rama-linux-core-{0}-{1}', github.run_id, strategy.job-index) }}
      cancel-in-progress: false
      queue: max
    # Target under an hour without making a cold build fail at that boundary.
    timeout-minutes: 90
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    env:
      RUSTFLAGS: -D warnings
      RUST_LOG: info
      # Deep generic service futures use more stack without LLVM optimization.
      RUST_MIN_STACK: 16777216
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: startsWith(matrix.os, 'windows')
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: nextest
      - uses: ./.github/actions/rust-cache
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain }}-
          env-vars: RUST_TOOLCHAIN
          shared-key: ${{ format('{0}-{1}-core-{2}-v3', matrix.os, matrix.toolchain, matrix.shard) }}
          # sccache is a net loss on Windows (mozilla/sccache#2789: ~0% hits, every
          # write bounces) and its failed entries evict useful macOS/Linux ones.
          sccache: ${{ startsWith(matrix.os, 'windows') && 'false' || 'true' }}
      - name: Build core tests
        id: build_core
        run: cargo nextest run --cargo-profile ci --profile ci --all-features ${{ matrix.packages }} --no-run --timings
      - name: Run core tests
        if: ${{ !cancelled() && steps.build_core.outcome == 'success' }}
        run: cargo nextest run --cargo-profile ci --profile ci --all-features ${{ matrix.packages }}
      # Compile-test fixtures must not compete with ordinary runtime tests.
      - name: Run ignored core tests
        if: ${{ !cancelled() && steps.build_core.outcome == 'success' }}
        run: cargo nextest run --cargo-profile ci --profile ci --test-threads 4 --all-features ${{ matrix.packages }} --run-ignored=only
      - name: Save build timings
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: core-timings-${{ matrix.os }}-${{ matrix.shard }}
          path: target/cargo-timings/
          if-no-files-found: ignore

  test-rust-examples:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: ${{ matrix.os == 'macos-latest' && (github.event_name == 'pull_request' && (needs.meta-lints.outputs.macos_pr_lane == '1' && 'rama-macos-slot-13' || 'rama-macos-slot-4') || 'rama-macos-slot-8') || matrix.os == 'windows-latest' && 'rama-windows-slot-0' || format('rama-linux-examples-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    needs: [precheck-rust, precheck-docs, precheck-fmt, meta-lints]
    env:
      RUSTFLAGS: -D warnings
      # XPC tests assert informational output; avoid trace-volume child logs.
      RUST_LOG: info
      CARGO_PROFILE_DEV_OPT_LEVEL: 0
      CARGO_PROFILE_TEST_OPT_LEVEL: 0
      # Each test launches peers; don't give every child all of the host CPUs.
      TOKIO_WORKER_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: runner.os == 'Windows'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: nextest
      - uses: ./.github/actions/rust-cache
        with:
          key: ${{ matrix.os }}-stable-examples
          shared-key: ${{ format('{0}-stable-examples-v2', matrix.os) }}
          sccache: ${{ runner.os == 'Windows' && 'false' || 'true' }}
      # Examples bind fixed ports from 62000, above Linux's ephemeral range;
      # match it here so concurrent client sockets cannot take those ports.
      - name: Keep ephemeral ports below the example ports (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($ip in 'ipv4', 'ipv6') {
            foreach ($proto in 'tcp', 'udp') {
              netsh int $ip set dynamicport $proto start=49152 num=11848
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              netsh int $ip show dynamicport $proto
            }
          }
      - name: Keep ephemeral ports below the example ports (macOS)
        if: runner.os == 'macOS'
        run: >-
          sudo sysctl -w
          net.inet.ip.portrange.first=49152 net.inet.ip.portrange.last=60999
          net.inet.ip.portrange.hifirst=49152 net.inet.ip.portrange.hilast=60999
      # --test still builds every real binary for CARGO_BIN_EXE_*. It avoids
      # additionally linking 106 binary test harnesses, most of which are empty.
      - name: Run all example integration tests, including ignored tests
        run: cargo nextest run --profile ci --test-threads 4 --all-features -p rama-examples --test integration --run-ignored=all
      # These two binaries contain the shared gRPC job unit tests.
      - name: Run example binary unit tests
        run: cargo nextest run --profile ci --all-features -p rama-examples --bin http_grpc_job_client --bin http_grpc_job_server

  test-datastar-sdk:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.0"
          cache: false
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-latest-${{ env.RUST_TOOLCHAIN }}-datastar-sdk
          env-vars: RUST_TOOLCHAIN
      - name: Run official Datastar SDK test suite
        run: ./scripts/test-datastar-sdk.sh

  test-ffi-apple-example-transparent-proxy-e2e:
    permissions:
      contents: read
    runs-on: macos-latest
    concurrency:
      # Idle in regular CI, so this long job runs beside the macOS checks
      # instead of queueing behind the stable check on slot 2.
      group: rama-macos-slot-0
      cancel-in-progress: false
      queue: max
    timeout-minutes: 180
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
      - uses: ./.github/actions/rust-cache
        with:
          key: macos-latest-${{ env.RUST_TOOLCHAIN }}-apple-transparent-proxy-e2e
          env-vars: RUST_TOOLCHAIN
          workspaces: |
            ffi/apple/examples/transparent_proxy/tproxy_rs
            ffi/apple/examples/transparent_proxy/tproxy_ffi_e2e
      - name: Install Apple Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          # v2.1.4 assets were replaced upstream; keep checksum verification intact.
          tool: just,nextest,cargo-sort@2.1.3
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          prune-cache: true
      - name: Install Apple example build and lint tools
        run: brew install xcodegen shellcheck
      # Checks below keep going after a failed check, but never after a failed setup.
      - name: Setup complete
        id: setup
        run: echo "setup complete"
      - name: Run transparent proxy Apple QA
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just qa-ffi-apple
      - name: Run transparent proxy Apple FFI e2e tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just test-e2e-ffi-apple
      - name: Rerun Swift FFI battery under lldb on failure
        if: ${{ failure() && steps.setup.outcome == 'success' }}
        run: |
          sysctl hw.ncpu hw.memsize
          ulimit -n
          xcrun lldb --batch \
            -o "run" \
            -k "thread backtrace all" \
            -k "quit 1" \
            -o "quit" \
            -- "$(xcrun --find xctest)" \
            .build/arm64-apple-macosx/debug/RamaAppleNetworkExtensionPackageTests.xctest
      - name: Run RamaAppleNetworkExtension Swift FFI tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just test-e2e-ffi-swift
      - name: Rerun Swift FFI battery under lldb on failure
        if: ${{ failure() && steps.setup.outcome == 'success' }}
        run: |
          sysctl hw.ncpu hw.memsize
          ulimit -n
          xcrun lldb --batch \
            -o "run" \
            -k "thread backtrace all" \
            -k "quit 1" \
            -o "quit" \
            -- "$(xcrun --find xctest)" \
            .build/arm64-apple-macosx/debug/RamaAppleNetworkExtensionPackageTests.xctest
      - name: Run Swift-side ThreadSanitizer battery
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just ./ffi/apple/examples/transparent_proxy/run-tproxy-ffi-e2e-swift-tsan
      - name: Build Release products and run optimized Swift FFI tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just ./ffi/apple/examples/transparent_proxy/run-tproxy-ffi-e2e-swift-release
      - name: Verify private API compile-time opt-in
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just ./ffi/apple/examples/transparent_proxy/test-private-api-trait
      - name: Require complete TCP egress coverage under ASan
        id: egress_policy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          TMPDIR: ${{ runner.temp }}
        # Local peers only; no sudo, system PAC or signed extension required.
        run: just ./ffi/apple/examples/transparent_proxy/test-egress-policy --configuration asan --scratch-path "$RUNNER_TEMP/egress-policy-build"
      - name: Retain TCP egress validation report
        if: ${{ !cancelled() && steps.egress_policy.outcome != 'skipped' }}
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: apple-tcp-egress-policy
          path: ${{ runner.temp }}/rama-egress-policy-*/report.zip
          if-no-files-found: warn
          retention-days: 7

