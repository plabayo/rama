  test-quic-external-gnutls:
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.96.0"]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [precheck-rust, precheck-docs, precheck-fmt, meta-lints]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - name: Install GnuTLS development library and certificate tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgnutls28-dev gnutls-bin pkg-config
          certtool --version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-24.04-${{ matrix.toolchain }}-quic-external-gnutls
          env-vars: RUST_TOOLCHAIN
          workspaces: rama-quic/e2e/gnutls-interop
      - name: Real external TLS provider without Rama native backends
        run: just rama-quic/qa-interop-gnutls

  test-quic-interop-runner:
    strategy:
      fail-fast: false
      matrix:
        backend: [boring, rustls-ring, rustls-aws-lc]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packet analysis tools
        run: |
          sudo add-apt-repository --yes ppa:wireshark-dev/stable
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends tshark python3-venv
          sudo modprobe ip6table_filter
          tshark --version
          docker compose version
      - name: Set up Docker Engine
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just
      - name: Test both roles against quic-go and ngtcp2
        run: just rama-quic/test-interop-runner --backend ${{ matrix.backend }} --artifacts "$RUNNER_TEMP/quic-interop"
      - name: Retain interop reports and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quic-interop-runner-${{ matrix.backend }}
          path: ${{ runner.temp }}/quic-interop
          if-no-files-found: warn
          retention-days: 7

  check-rama-icap-feature-boundaries:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
          targets: x86_64-unknown-none
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-latest-${{ env.RUST_TOOLCHAIN }}-icap-features
          env-vars: RUST_TOOLCHAIN
      - name: Test the package without features
        run: cargo test --locked -p rama-icap --no-default-features
      - name: Check each opt-in feature boundary
        run: |
          cargo check --locked -p rama-icap --no-default-features --features std
          cargo check --locked -p rama-icap --no-default-features --features http
      - name: Check the no_std target
        run: >-
          cargo check --locked -p rama-icap --no-default-features
          --target x86_64-unknown-none

  test-rust-linux-musl:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            toolchain: stable
            target: aarch64-unknown-linux-musl
    name: test-rust-linux-musl-${{ matrix.toolchain }}-${{ matrix.os }}-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/rust-cache
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain }}-${{ matrix.target }}
          env-vars: RUST_TOOLCHAIN
      - name: Install Zig
        if: contains(matrix.target, 'unknown-linux-musl')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-zigbuild
      - name: Build Workspace
        run: |
          cargo zigbuild -p rama -p rama-cli --target ${{ matrix.target }} --all-features
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Scratch run test (rama-cli, with diagnostics)
        shell: bash
        run: |
          set -euo pipefail

          bin="target/${{ matrix.target }}/debug/rama"
          echo "Binary path: $bin"
          ls -lah "$bin"

          echo "file:"
          file "$bin" || true

          echo "readelf program headers (interpreter should be absent for static):"
          readelf -l "$bin" || true

          echo "readelf dynamic section (NEEDED should be absent for static):"
          readelf -d "$bin" || true

          dir="$(mktemp -d)"
          cp "$bin" "$dir/rama"
          chmod +x "$dir/rama"

          cat > "$dir/Dockerfile" <<'EOF'
          FROM scratch
          COPY rama /rama
          ENTRYPOINT ["/rama"]
          EOF

          echo "Building scratch image"
          docker buildx build --progress=plain --load -t rama-cli-scratch-test "$dir"

          echo "Smoke test in scratch: --help"
          docker run --rm rama-cli-scratch-test --help || true

          echo "HTTPS test in scratch"
          set +e
          docker run --rm --name rama-cli-scratch-test-run \
            rama-cli-scratch-test -k https://example.com
          rc="$?"
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "rama-cli exited with code $rc"

            echo "docker inspect:"
            docker inspect rama-cli-scratch-test-run || true

            echo "docker logs:"
            docker logs rama-cli-scratch-test-run || true

            echo "docker rm:"
            docker rm -f rama-cli-scratch-test-run >/dev/null 2>&1 || true

            exit "$rc"
          fi

  test-rust-linux-gnu-cross-macos:
    runs-on: macos-latest
    concurrency:
      group: rama-macos-slot-2
      cancel-in-progress: false
      queue: max
    timeout-minutes: 360
