      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rama-cli-linux-x86_64-gnu-glibc-2.17
          path: target/x86_64-unknown-linux-gnu/debug
      - name: Start the cross-built Rama CLI on Linux
        run: just test-zigbuild-linux-gnu-smoke

  precheck-rust-tier2:
    strategy:
      matrix:
        thing:
          - arm-android
          - arm64-android
          - i686-android
          - x86_64-android
          - aarch64-ios
          - x86_64-ios
        include:
          - custom_env: {}
          - thing: arm-android
            target: armv7-linux-androideabi
            rust: stable
            os: ubuntu-latest
          - thing: arm64-android
            target: aarch64-linux-android
            rust: stable
            os: ubuntu-latest
          - thing: i686-android
            target: i686-linux-android
            rust: stable
            os: ubuntu-latest
          - thing: x86_64-android
            target: x86_64-linux-android
            rust: stable
            os: ubuntu-latest
          - thing: aarch64-ios
            target: aarch64-apple-ios
            rust: stable
            os: macos-latest
            custom_env:
              IPHONEOS_DEPLOYMENT_TARGET: 17.5
          - thing: x86_64-ios
            target: x86_64-apple-ios
            os: macos-15-intel
            rust: stable
            custom_env:
              IPHONEOS_DEPLOYMENT_TARGET: 17.5
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ startsWith(matrix.os, 'macos') && (matrix.os == 'macos-15-intel' && 'rama-macos-slot-0' || 'rama-macos-slot-1') || startsWith(matrix.os, 'windows') && ('rama-windows-slot-2') || format('rama-linux-tier2-{0}-{1}', github.run_id, strategy.job-index) }}
      cancel-in-progress: false
      queue: max
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: RUST_TOOLCHAIN
          key: ${{ matrix.os }}-${{ matrix.rust }}-${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}
      - name: Configure Android toolchain env
        if: endsWith(matrix.thing, '-android')
        shell: bash
        run: |
          ANDROID_API=21

          # Normalize NDK env vars
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-$ANDROID_NDK}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${ANDROID_NDK:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"

          TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "${TOOLCHAIN}" >> "$GITHUB_PATH"

          TRIPLE="${{ matrix.target }}"
          TARGET_UPPER="$(echo "${TRIPLE}" | tr '[:lower:]-' '[:upper:]_')"
          TARGET_LOWER_UNDERSCORES="$(echo "${TRIPLE}" | tr '-' '_' | tr '[:upper:]' '[:lower:]')"
          NDK_TRIPLE="${TRIPLE/#armv7/armv7a}"

          CC_PATH="${TOOLCHAIN}/${NDK_TRIPLE}${ANDROID_API}-clang"
          CXX_PATH="${TOOLCHAIN}/${NDK_TRIPLE}${ANDROID_API}-clang++"
          AR_PATH="${TOOLCHAIN}/llvm-ar"

          {
            echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=${CXX_PATH}"

            # Target specific for cc-rs style
            echo "CC_${TARGET_LOWER_UNDERSCORES}=${CC_PATH}"
            echo "CXX_${TARGET_LOWER_UNDERSCORES}=${CXX_PATH}"
            echo "AR_${TARGET_LOWER_UNDERSCORES}=${AR_PATH}"

            # Also set generic vars in case your Config only reads CC/CXX/AR
            echo "CC=${CC_PATH}"
            echo "CXX=${CXX_PATH}"
            echo "AR=${AR_PATH}"
          } >> "$GITHUB_ENV"
      - name: check
        env: ${{ matrix.custom_env }}
        run: |
          cargo check --workspace --target ${{ matrix.target }} --all-features
      - name: Build tests
        env: ${{ matrix.custom_env }}
        # We `build` because we want the linker to verify we are cross-compiling correctly for check-only targets.
        run: |
          cargo build --target ${{ matrix.target }} --tests --all-features

  # The rest of CI builds rama on stable tokio. This job covers dial9's full-fidelity path
  test-dial9-tokio-unstable:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
          components: clippy
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just,nextest
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: RUST_TOOLCHAIN
          key: ubuntu-latest-${{env.RUST_TOOLCHAIN}}-dial9-tokio-unstable
      # The recipe sets `--cfg tokio_unstable`, setting RUSTFLAGS here would
      # not survive the justfile's own `export RUSTFLAGS`.
      - name: Run dial9 QA checks under tokio_unstable
        run: just qa-dial9-tokio-unstable

  test-loom:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: nextest
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: RUST_TOOLCHAIN
          key: ubuntu-latest-${{env.RUST_TOOLCHAIN}}-loom
      - name: Run Loom tests (rama-utils)
        run: |
          RUSTFLAGS="--cfg loom -Dwarnings" \
            cargo nextest run --all-features -p rama-utils

  cargo-hack:
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-hack@0.6.45
      - uses: ./.github/actions/rust-cache
        with:
          env-vars: RUST_TOOLCHAIN
          key: ubuntu-latest-${{env.RUST_TOOLCHAIN}}-cargo-hack-${{ matrix.partition }}
      - name: install protoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
          protoc --version
      - name: Check every individual feature, including dial9
        run: cargo hack check --each-feature --no-dev-deps --workspace --partition ${{ matrix.partition }}/2

  test-rust-e2e-release:
    strategy:
      matrix:
        toolchain:
          - stable
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    # Allow for a cold build with reduced parallelism plus ~40m of ignored tests.
    timeout-minutes: 120
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: startsWith(matrix.os, 'windows')
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: nextest
      - uses: ./.github/actions/rust-cache
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain }}-release
          env-vars: RUST_TOOLCHAIN
      - name: Run tests in release mode (--ignored)
        timeout-minutes: 110
        run: |
          # Preserve resource evidence if the runner shuts down during compilation.
          free -m
          df -h "$GITHUB_WORKSPACE"
          stdbuf -oL vmstat -w -t 30 &
          resource_monitor=$!
          trap 'kill "$resource_monitor" 2>/dev/null || true; wait "$resource_monitor" 2>/dev/null || true' EXIT
          # Concurrent release compilations can exhaust this runner's RAM and swap.
          /usr/bin/time -v cargo nextest run --build-jobs 2 --profile ci --all-features --release --workspace --run-ignored=only

  test-ws-autobahn-server:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    # The server suite usually takes ~12-22m.
    timeout-minutes: 90
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-latest-${{ env.RUST_TOOLCHAIN }}-autobahn-server
          env-vars: RUST_TOOLCHAIN
      - name: Verify jq
        run: jq --version
      - name: Run autobahn ws server test-suite
        shell: bash
        working-directory: "./rama-ws"
        timeout-minutes: 30
        run: ./autobahn/server.sh

  test-ws-autobahn-client:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    # The client suite usually takes ~7-13m, but overloaded hosted runners
    # have occasionally made it exceed 25m.
    timeout-minutes: 90
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: ./.github/actions/rust-cache
        with:
          key: ubuntu-latest-${{ env.RUST_TOOLCHAIN }}-autobahn-client
          env-vars: RUST_TOOLCHAIN
      - name: Verify jq
        run: jq --version
      - name: Run autobahn ws client test-suite
        shell: bash
        working-directory: "./rama-ws"
        timeout-minutes: 45
        run: ./autobahn/client.sh

  test-spec-h2:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{env.RUST_TOOLCHAIN}}
      - name: h2spec
        run: |
          bash rama-http-core/ci/h2spec.sh -F

  semver-checks:
    runs-on: ubuntu-latest
    needs:
      - precheck-rust
      - precheck-docs
      - precheck-fmt
      - meta-lints
    env:
      # The released 0.4 baseline still depends on dial9 0.3, which only
      # compiles with Tokio's unstable APIs (the workspace config used to
      # carry this flag). Drop once a dial9-0.5-based rama is the
      # published baseline.
      RUSTFLAGS: --cfg tokio_unstable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          rust-toolchain: ${{env.RUST_TOOLCHAIN}}

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - precheck-rust
      - precheck-docs
      - check-rust
      - doc-rust
      - test-rust-base
      - test-datastar-sdk
      - test-ffi-apple-example-transparent-proxy-e2e
      - test-rama-dial9
      - test-fastcgi-php
      - test-icap-oracle
      - test-quic-interop-qa
      - test-quic-interop-runner
      - test-quic-external-gnutls
      - check-rama-icap-feature-boundaries
      - test-rust-linux-musl
      - test-rust-linux-gnu-cross-smoke
      - precheck-rust-tier2
      - test-dial9-tokio-unstable
      - test-loom
      - meta-lints
      - test-rust-e2e-release
      - test-ws-autobahn-server
      - test-ws-autobahn-client
      - test-spec-h2
      - semver-checks
      - test-rust-linux-gnu-cross-macos
      - test-rust-linux-gnu-cross-windows
      - cargo-hack
      - precheck-fmt
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  deploy-rama-cli-docker:
    runs-on: ubuntu-latest
    needs: ci-success
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Set up emulation for the interop endpoint image
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a
        with:
          platforms: arm64
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          tags: glendc/rama:edge
          file: rama-cli/infra/Dockerfile

      - name: Build and push QUIC interop endpoints
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: glendc/rama-quic-interop:edge
          file: rama-quic/e2e/interop-runner/Dockerfile

  deploy-rama-fp-fly:
    runs-on: ubuntu-latest
    needs: deploy-rama-cli-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: |
          cd rama-fp/infra/deployments/fp
          flyctl scale count app_secure=1 app_insecure=1 --yes
          flyctl deploy --verbose --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-rama-fp-h1-fly:
    runs-on: ubuntu-latest
    needs: deploy-rama-cli-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: |
          cd rama-fp/infra/deployments/fp-h1
          flyctl scale count app_secure=1 app_insecure=1 --yes
          flyctl deploy --verbose --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-rama-ip-ipv4-fly:
    runs-on: ubuntu-latest
    needs: deploy-rama-cli-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: |
          cd rama-fp/infra/deployments/ipv4
          flyctl scale count app_secure=1 app_insecure=1 --yes
          flyctl deploy --verbose --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-rama-ip-ipv6-fly:
    runs-on: ubuntu-latest
    needs: deploy-rama-cli-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: |
          cd rama-fp/infra/deployments/ipv6
          flyctl scale count app_secure=1 app_insecure=1 --yes
          flyctl deploy --verbose --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-rama-echo-fly:
    runs-on: ubuntu-latest
    needs: deploy-rama-cli-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: |
          cd rama-fp/infra/deployments/echo
          flyctl scale count app_secure=1 app_insecure=1 --yes
          flyctl deploy --verbose --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-rama-http-test-fly:
    runs-on: ubuntu-latest
    needs: deploy-rama-cli-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: |
          cd rama-fp/infra/deployments/http-test
          flyctl scale count app_secure=1 app_insecure=1 --yes
          flyctl deploy --verbose --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
