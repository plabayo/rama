name: Cancel merged PR workflows

on:
  # Metadata only: never check out or execute code from the pull request.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [closed]

permissions: {}

jobs:
  cancel-pr-workflows:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Cancel unfinished workflows belonging to the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs_url="repos/${GITHUB_REPOSITORY}/actions/runs"
          for status in queued in_progress pending waiting requested; do
            gh api --paginate --slurp "${runs_url}?status=${status}&per_page=100" |
              jq --argjson self "$GITHUB_RUN_ID" --slurpfile event "$GITHUB_EVENT_PATH" '
                $event[0].pull_request as $pr |
                .[].workflow_runs[] |
                select(.id != $self and .created_at <= $pr.merged_at) |
                select(
                  (.event == "pull_request" and any(.pull_requests[]?; .number == $pr.number)) or
                  (.event == "workflow_dispatch" and
                   $pr.head.repo != null and
                   .head_branch != $event[0].repository.default_branch and
                   .head_repository.id == $pr.head.repo.id and
                   .head_branch == $pr.head.ref)
                ) | .id
              '
          done | sort -u > "$RUNNER_TEMP/merged-pr-runs"

          while read -r run_id; do
            echo "Cancelling merged PR workflow ${run_id}"
            if ! gh api -X POST "${runs_url}/${run_id}/cancel"; then
              # A run can finish between listing it and requesting cancellation.
              current=$(gh api "${runs_url}/${run_id}" --jq .status)
              if [[ "$current" != completed ]]; then
                echo "Could not cancel unfinished run ${run_id}" >&2
                exit 1
              fi
            fi
          done < "$RUNNER_TEMP/merged-pr-runs"
