name: Cancel merged PR workflows

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [closed]
  # Catch late starts and reruns as well as the merge itself.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI, "Deploy mdBook site to Pages", "CI (daily platforms)", "CI (unstable toolchains)"]
    types: [requested, in_progress]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: cancel-merged-pr-workflows
  cancel-in-progress: false
  queue: max

jobs:
  cancel-pr-workflows:
    if: >-
      (github.event_name != 'pull_request_target' || github.event.pull_request.merged == true) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      # Only the default branch's helper is trusted, including manual dispatches.
      # Never check out a PR head, consume its artifacts, or install dependencies.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Cancel and verify unfinished merged PR workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/cancel_merged_pr_runs.py
