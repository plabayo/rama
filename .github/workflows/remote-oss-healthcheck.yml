name: Rama OSS basic health check

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  healthcheck:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          prune-cache: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just
      - name: Check public DNS and HTTP services
        run: just rama-fp/remote-healthcheck --output "$RUNNER_TEMP/remote-healthcheck"
      - name: Preserve health report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-healthcheck
          if-no-files-found: ignore
          path: ${{ runner.temp }}/remote-healthcheck
