name: Rama OSS basic health check

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  healthcheck:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: just
      - name: Check public DNS and HTTP services
        run: just remote-healthcheck --output "$RUNNER_TEMP/remote-healthcheck"
      - name: Preserve health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-healthcheck
          if-no-files-found: ignore
          path: ${{ runner.temp }}/remote-healthcheck
