[package]
name = "rama-cli"
description = "rama cli to move and transform network packets"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }
default-run = "rama"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
# native C deps can't cross-compile in the docs.rs builder; linux-only docs
targets = ["x86_64-unknown-linux-gnu"]

[[bin]]
name = "rama"
path = "src/main.rs"

[features]
default = []
# Attach a [dial9] recorder to the CLI's runtime when `DIAL9_ENABLED` is set,
# so the shipped binary can be flight-recorded (poll times, schedule latency).
#
# [dial9]: https://github.com/dial9-rs/dial9
dial9 = ["dep:dial9", "rama/dial9"]

[dependencies]
arc-swap = { workspace = true }
base64 = { workspace = true, default-features = true }
bb8 = { workspace = true }
bb8-postgres = { workspace = true }
clap = { workspace = true }
dial9 = { workspace = true, optional = true }
hickory-resolver = { workspace = true }
itertools = { workspace = true, default-features = true }
jiff = { workspace = true }
mimalloc = { workspace = true, optional = true }
parking_lot = { workspace = true }
rama = { workspace = true, features = [
    "boring",
    "cli",
    "dns-hickory",
    "tcp",
    "udp",
    "http-full",
    "inspect",
    "icap",
    "grpc",
    "js-disk-cache",
    "pac",
    "proxy-full",
    "quic",
    "opentelemetry",
    "mmap",
], default-features = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
terminal-prompt = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tokio-postgres = { workspace = true, features = ["with-serde_json-1", "with-jiff-0_2"] }
tui-logger = { workspace = true }

[target.'cfg(target_family = "unix")'.dependencies]
jemallocator = { workspace = true }

[target.'cfg(windows)'.dependencies]
mimalloc = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
rama = { path = "..", features = ["test-utils"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
