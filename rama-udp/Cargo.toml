[package]
name = "rama-udp"
description = "UDP support for rama"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
keywords = ["io", "async", "udp", "network", "rama"]
categories = ["asynchronous", "network-programming", "web-programming"]
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.cargo-public-api-crates]
allowed = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-linux-android",
]

[features]
default = []
test-utils = ["dep:parking_lot"]

[dependencies]
parking_lot = { workspace = true, optional = true }
rama-core = { workspace = true, features = ["std"] }
rama-net = { workspace = true, features = ["std"] }
rama-utils = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "net"] }
tokio-util = { workspace = true, features = ["net"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }

[dev-dependencies]
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt"] }

[lints]
workspace = true
