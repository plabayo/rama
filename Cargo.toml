[package]
name = "rama"
readme = "README.md"
documentation = "https://docs.rs/rama"
description = "modular service framework"
# We use examples/ as standalone crate, disable this so cargo doesn't also pick this up as examples here
autoexamples = false
autobenches = false
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }
resolver = "3"

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "tokio_unstable"]
rustdoc-args = ["--cfg", "docsrs"]
# native C deps can't cross-compile in the docs.rs builder; linux-only docs
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.cargo-machete]
# cc + rustversion are used by build.rs, which cargo-machete cannot see
ignored = ["cc", "rustversion"]

[workspace]
members = [
    ".",
    "examples",
    "examples/grpc",
    "examples/grpc/tests/extern_path/my_application",
    "examples/grpc/tests/extern_path/uuid",
    "fuzz",
    "rama-cli",
    "rama-core",
    "rama-crypto",
    "rama-dns",
    "rama-error",
    "rama-fastcgi",
    "rama-grpc",
    "rama-grpc-build",
    "rama-grpc-macros",
    "rama-haproxy",
    "rama-http",
    "rama-http-backend",
    "rama-http-core",
    "rama-http-core/tests/h2-fuzz",
    "rama-http-core/tests/h2-support",
    "rama-http-headers",
    "rama-http-hyperium",
    "rama-http-macros",
    "rama-http-types",
    "rama-icap",
    "rama-inspect",
    "rama-js",
    "rama-json",
    "rama-macros",
    "rama-macros/tests/macros",
    "rama-net",
    "rama-net-apple-networkextension",
    "rama-net-apple-xpc",
    "rama-pac",
    "rama-proxy",
    "rama-socks5",
    "rama-tcp",
    "rama-tls",
    "rama-tls-acme",
    "rama-tls-boring",
    "rama-tls-rustls",
    "rama-tower",
    "rama-ttrpc",
    "rama-ttrpc-build",
    "rama-ua",
    "rama-udp",
    "rama-unix",
    "rama-utils",
    "rama-ws",
]

