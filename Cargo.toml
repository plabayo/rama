    "rama-fastcgi?/http",
    "rama-tower?/http",
]
# generic http backend closure (connector/server plumbing), without
# committing to client, proxy or server specifics: those feature-gate
# their own extra requirements (e.g. `EasyHttpWebClient` also needs
# `tcp` + `dns`) on top of this.
http-backend = ["http", "dep:rama-http-backend", "dep:rama-http-core", "dep:tokio"]
http-full = [
    "http-backend",
    # `EasyHttpWebClient` (see `http::client`) needs these on top of
    # `http-backend`; kept here so `http-full` stays a strict superset.
    "tcp",
    "dns",
    "ws",
    "idna",
    "ua-embed-profiles",
    "compression",
    "multipart",
    "html",
    "rss",
    "rama-grpc?/transport",
]
http-hyperium = ["rama-http?/hyperium"]
multipart = ["http", "rama-http?/multipart"]
html = ["http", "rama-http?/html"]
rss = ["http", "rama-http?/rss"]
proxy = ["std", "dep:rama-proxy"]
haproxy = ["std", "dep:rama-haproxy"]
fastcgi = ["dep:rama-fastcgi", "rama-fastcgi?/transport", "tcp"]
socks5 = ["std", "dep:pin-project-lite", "dep:rama-socks5", "udp", "tcp"]
ua = ["std", "dep:rama-ua"]
ua-embed-profiles = ["ua", "rama-ua?/embed-profiles"]
proxy-memory-db = ["proxy", "rama-proxy?/memory-db", "rama-net/venndb"]
proxy-live-update = ["proxy", "rama-proxy?/live-update"]
proxy-csv = ["proxy", "rama-proxy?/csv"]
proxy-full = ["proxy-memory-db", "proxy-live-update", "proxy-csv", "haproxy", "socks5"]
tower = ["std", "dep:rama-tower"]
opentelemetry = [
    "std",
    "rama-core/opentelemetry",
    "rama-http?/opentelemetry",
    "rama-http-backend?/opentelemetry",
    "rama-net?/opentelemetry",
    "rama-grpc?/opentelemetry",
]
# Optional [dial9] runtime-telemetry support across the rama crate
# family. Sub-crates either ship predefined `TraceEvent` types or forward
# support to shared runtime boundaries. Event emission is a no-op when no
# `dial9` recorder is attached to the consumer's runtime.
#
# `--cfg tokio_unstable` is optional. Without it dial9 takes poll
# events from its own spawn helpers, so coverage is the tasks rama
# routes through `rama_core::rt::Executor` and `rama_core::rt::spawn`.
# Set it (per-build via `RUSTFLAGS`, or in your `.cargo/config.toml`)
# to also get every other task on the runtime, task spawn/terminate
# events and per-worker queue depth.
#
# [dial9]: https://github.com/dial9-rs/dial9
dial9 = [
    "std",
    "rama-core/dial9",
    "rama-http?/dial9",
    "rama-net?/dial9",
