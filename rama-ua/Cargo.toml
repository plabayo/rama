[package]
name = "rama-ua"
description = "user-agent (UA) support for rama"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
keywords = ["useragent", "user-agent", "rama"]
categories = ["parser-implementations", "web-programming"]
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.cargo-public-api-crates]
allowed = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
# Native dependencies require Linux docs.rs builds; edge-docs covers other hosts.
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = []
inspect = [
    "dep:parking_lot",
    "dep:rama-inspect",
    "rama-http/inspect",
    "rama-tls?/inspect",
]
embed-profiles = ["dep:zstd"]
tls = ["dep:rama-tls", "rama-tls/http"]

[dependencies]
ahash = { workspace = true }
chacha20 = { workspace = true, features = ["rng"] }
parking_lot = { workspace = true, optional = true }
rama-core = { workspace = true, features = ["std"] }
rama-http = { workspace = true }
rama-inspect = { workspace = true, optional = true }
rama-net = { workspace = true, features = ["std"] }
rama-quic-proto = { workspace = true, default-features = false, features = ["std"] }
rama-tls = { workspace = true, optional = true }
rama-utils = { workspace = true, features = ["std"] }
rand = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_html_form = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
zstd = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
